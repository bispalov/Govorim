<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12181F">
<link rel="manifest" href="/Govorim/manifest.json">
<link rel="icon" href="/Govorim/icon-192.png">
<title>Говоримо разом</title>
<style>
:root {
  --ink: #EEF2F5;
  --bg: #12181F;
  --card-bg: #1E293B;
  --navy: #1E3A8A;
  --accent: #3B82F6;
  --border: #334155;
}

[data-theme="light"] {
  --ink: #14202B;
  --bg: #EEF2F5;
  --card-bg: #FFFFFF;
  --navy: #16384F;
  --accent: #2563EB;
  --border: #CBD5E1;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;margin:0;max-width:100%;overflow-x:hidden;background:var(--bg);color:var(--ink);font:600 20px/1.2 system-ui,Roboto,sans-serif;-webkit-text-size-adjust:100%;text-size-adjust:100%;transition:background 0.2s, color 0.2s}
body{display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
:focus-visible{outline:4px solid #F2B705;outline-offset:2px}

/* Шапка (сетка).
   Узкий экран: название отдельной строкой, ниже ряд кнопок; на главном экране 🎤 и «Азбука» — отдельным крупным рядом.
   Широкий экран: кнопки 🎤 и «Азбука» (с подписями от 900 px) посередине шапки. На тяжёлом уровне «Азбуки» нет. */
header{display:grid;gap:6px 4px;align-items:center;padding:8px 10px;background:var(--navy);color:#fff;
  grid-template-columns:repeat(7,minmax(0,1fr));
  grid-template-areas:"t t t t t t t" "home mic abc lang set help ed"}
header h1{grid-area:t;min-width:0;margin:0;padding:2px 4px 0;font-size:clamp(18px,5.6vw,24px);line-height:1.15;overflow-wrap:anywhere;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;overflow:hidden}
.hb{min-width:0;min-height:50px;border-radius:14px;background:#ffffff26;color:#fff;font-size:clamp(20px,6vw,24px);display:flex;align-items:center;justify-content:center;gap:10px}
.hb[hidden]{display:none !important}
#home{grid-area:home}#lang{grid-area:lang}#settingsBtn{grid-area:set}#helpBtn{grid-area:help}#gear{grid-area:ed}#micBtn{grid-area:mic}#abcBtn{grid-area:abc}
#micBtn{background:#1F7A4D;color:#fff;font-weight:800;box-shadow:inset 0 0 0 2px #ffffffb3}   /* цвет кнопки «Да» внизу + тонкая светлая рамка */
#abcBtn{background:#2B6CB0;color:#fff;font-weight:800;box-shadow:inset 0 0 0 2px #ffffffb3}
.hb .lbl{display:none;font-size:clamp(14px,4.4vw,19px);line-height:1.15;text-align:left}
body.no-abc header{grid-template-columns:repeat(6,minmax(0,1fr));grid-template-areas:"t t t t t t" "home mic lang set help ed"}
body.at-home header{grid-template-columns:repeat(5,minmax(0,1fr));grid-template-areas:"t t t t t" "home lang set help ed" "mic mic mic abc abc";gap:6px 8px}
body.at-home.no-abc header{grid-template-areas:"t t t t t" "home lang set help ed" "mic mic mic mic mic"}
body.at-home #micBtn,body.at-home #abcBtn{min-height:60px;padding:0 10px}
body.at-home .hb .lbl{display:inline}
@media (min-width:640px){
  header,body.at-home header{grid-template-columns:56px auto minmax(0,1fr) auto auto minmax(0,1fr) repeat(4,56px);grid-template-areas:"home t . mic abc . lang set help ed";gap:8px}
  body.no-abc header,body.at-home.no-abc header{grid-template-columns:56px auto minmax(0,1fr) auto minmax(0,1fr) repeat(4,56px);grid-template-areas:"home t . mic . lang set help ed"}
  header h1{padding:0 4px;font-size:24px;white-space:nowrap;-webkit-line-clamp:1;line-clamp:1}
  .hb,body.at-home .hb{min-height:56px}
  #micBtn,#abcBtn,body.at-home #micBtn,body.at-home #abcBtn{min-height:56px;padding:0 22px}
  .hb .lbl,body.at-home .hb .lbl{display:none}
}
@media (min-width:900px){
  .hb .lbl,body.at-home .hb .lbl{display:inline;white-space:nowrap}
}

#stage{flex:1;position:relative;min-height:0}
main{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,140px),1fr));gap:10px}
.sec{margin:8px 2px 4px;font-size:18px;opacity:.8;font-weight:700}

.tile{min-width:0;min-height:120px;border-radius:18px;border:3px solid var(--c);background:color-mix(in srgb, var(--c) 20%, var(--card-bg));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:8px 6px;font-size:clamp(15px,4.8vw,22px);font-weight:700;text-align:center;overflow-wrap:break-word;color:var(--ink)}
.tile .em{font-size:clamp(40px,12vw,52px);line-height:1}
.tile img,.big img{width:80px;height:80px;object-fit:cover;border-radius:12px}

.say{width:100%;min-height:64px;margin-bottom:10px;border-radius:16px;background:var(--navy);color:#fff;font-size:clamp(18px,5.4vw,22px);padding:10px;text-align:left;overflow-wrap:anywhere}

.build{padding:10px 14px;margin-bottom:10px;border-radius:16px;border:2px dashed var(--border);background:var(--card-bg)}
.build .bl{font-size:14px;opacity:.7;font-weight:700;margin-bottom:2px}
.build .bt{font-size:clamp(22px,6.6vw,30px);font-weight:800;line-height:1.2;overflow-wrap:anywhere}

#ov{position:absolute;inset:0;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:14px;text-align:center;overflow-y:auto;overflow-x:hidden;z-index:5}
#ov.red{background:#B3261E;color:#fff}
.big{max-width:100%;font-size:clamp(24px,7.4vw,30px);font-weight:800;line-height:1.15;overflow-wrap:anywhere}
.big .em{font-size:clamp(60px,20vw,80px);display:block}
.big img{width:140px;height:140px}

.row{display:flex;gap:10px;width:100%;flex-wrap:wrap;justify-content:center}
.chip{min-height:52px;padding:0 16px;border-radius:26px;background:var(--card-bg);border:2px solid var(--navy);color:var(--ink);font-size:18px}
.chip.on{background:var(--navy);color:#fff}

.ans{flex:1 1 130px;min-width:0;min-height:96px;border-radius:20px;font-size:clamp(22px,7vw,28px);color:#fff;font-weight:800}
.yes{background:#1F7A4D}.no{background:#B3261E}.neu{background:var(--navy)}

/* Нижняя панель: 6 равных колонок, ничего не вылезает за экран */
#bar{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;padding:6px 4px;background:var(--card-bg);border-top:2px solid var(--border)}
#bar button{min-width:0;min-height:64px;padding:2px 1px;border-radius:12px;font-size:clamp(8px,2.6vw,12px);letter-spacing:-.2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:color-mix(in srgb, var(--navy) 15%, var(--card-bg));color:var(--ink);font-weight:700;overflow:hidden}
#bar button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#bar .i{font-size:clamp(20px,6vw,24px)}
#bar .yes{background:#1F7A4D;color:#fff}
#bar .no{background:#B3261E;color:#fff}
#bar .hp{background:#B3261E;color:#fff}

/* Модальные окна: Редактор и Настройки */
.modal{position:fixed;inset:0;background:var(--bg);color:var(--ink);display:none;overflow-y:auto;overflow-x:hidden;padding:16px;padding-top:max(16px,env(safe-area-inset-top));padding-bottom:max(16px,env(safe-area-inset-bottom));z-index:20;font-size:17px;font-weight:500}
.modal h2{margin-top:0;font-size:24px}
.modal label{display:block;margin:12px 0 4px;font-weight:700}
.modal input[type=text],.modal input[type=password],.modal input[type=range],.modal select{width:100%;font:inherit;padding:10px;border:2px solid var(--border);border-radius:10px;background:var(--card-bg);color:var(--ink)}
.modal .row{margin:14px 0}
.modal button{min-height:50px;padding:0 16px;border-radius:12px;background:var(--navy);color:#fff;font-weight:700}
.modal button.d{background:#B3261E}
.modal .note{opacity:.75;font-size:15px}
.range-val{float:right;font-weight:normal;opacity:0.8}
.modal h3{font-size:19px;margin:20px 0 6px}
.modal p,.modal ul{margin:6px 0;line-height:1.45}
.modal ul{padding-left:22px}
.modal li{margin:5px 0}
.helphead{position:sticky;top:-16px;z-index:2;display:flex;gap:10px;align-items:center;justify-content:space-between;margin:-16px -16px 8px;padding:10px 16px;background:var(--bg);border-bottom:2px solid var(--border)}
.helphead h2{margin:0;font-size:22px}
.modal .chk{display:flex;align-items:flex-start;gap:12px;font-weight:600;margin:14px 0}
.modal input[type=checkbox]{width:26px;height:26px;flex:none;margin-top:1px}
.modal button.wide{width:100%;margin:6px 0}
.ans.sm{min-height:64px;font-size:clamp(18px,5.4vw,22px)}
.tile{position:relative}
.tile.armed{outline:5px solid #F2B705;outline-offset:2px}
.tile.del{border-style:dashed}
.tile.del::after{content:'✖';position:absolute;top:6px;right:10px;font-size:24px;color:#B3261E}
.sec.fh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.rec{background:#B3261E !important;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}
.sug{width:100%;display:flex;gap:12px;align-items:center;text-align:left;min-height:68px;border-radius:16px;border:3px solid var(--accent);background:var(--card-bg);color:var(--ink);font-size:clamp(19px,5.6vw,24px);font-weight:700;padding:8px 12px;margin:8px 0;overflow-wrap:anywhere}
.sug .em{font-size:32px;flex:none}
.mini{min-height:44px;min-width:44px;padding:0 12px;border-radius:12px;background:var(--card-bg);border:2px solid var(--border);color:var(--ink);font-size:18px;font-weight:700}
[data-size="l"] .grid{grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr))}
[data-size="l"] .tile{min-height:170px;font-size:clamp(18px,5.6vw,26px)}
[data-size="xl"] .grid{grid-template-columns:1fr}
[data-size="xl"] .tile{min-height:150px;font-size:clamp(22px,7vw,30px)}
.letters{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:8px}
.lt{min-height:62px;border-radius:14px;background:var(--card-bg);border:2px solid var(--navy);color:var(--ink);font-size:26px;font-weight:800}
.wd{min-height:64px;padding:6px 10px;border-radius:14px;background:var(--card-bg);border:3px solid var(--accent);color:var(--ink);font-size:clamp(20px,6vw,26px);font-weight:700;overflow-wrap:anywhere}
.pfx{font-size:clamp(30px,9vw,40px);font-weight:800}
.abcwrap{display:flex;flex-direction:column;min-height:100%}
.abcres{flex:1 0 auto}
.kb{position:sticky;bottom:-10px;margin:8px -10px -10px;padding:6px 10px 10px;background:var(--bg);border-top:2px solid var(--border);z-index:3}
.kbh{display:flex;gap:6px;margin-bottom:6px}
.kbt{flex:1;min-width:0;min-height:40px;border-radius:10px;background:var(--card-bg);border:2px solid var(--border);color:var(--ink);font-size:15px;font-weight:700;padding:0 6px}
.letters.kbd{grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:4px}
.letters.kbd .lt{min-height:44px;font-size:21px;padding:0;border-radius:10px}
.build.cmp{padding:6px 12px;margin-bottom:6px}
.build.cmp .bl{display:none}
.build.cmp .bt{font-size:clamp(20px,5.6vw,26px)}
.abcres .row{margin:4px 0}
.abcres .ans.sm{min-height:52px}
.abcres .row.tr{flex-wrap:nowrap;align-items:center;justify-content:flex-start}
.abcres .row.tr .pfx{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;text-align:left}
.abcres .row.tr .ans.sm{flex:0 0 64px;min-width:0;font-size:22px}
.sylw{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:6px 0}
.syl{min-height:70px;min-width:64px;padding:0 14px;border-radius:16px;background:var(--navy);color:#fff;font-size:clamp(26px,8vw,36px);font-weight:800}
.bars{display:flex;gap:6px;align-items:flex-end;height:96px;margin:8px 0}
.bars .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;font-size:12px;gap:2px}
.bars i{display:block;width:100%;background:var(--accent);border-radius:6px 6px 0 0}
.dl{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--border);font-size:16px}
.dl b{flex:none}
</style>
</head>
<body>
<header>
  <button class="hb" id="home" aria-label="Домой">🏠</button>
  <h1 id="ttl"></h1>
  <button class="hb" id="lang" aria-label="Язык">RU</button>
  <button class="hb" id="micBtn" aria-label="Подсказка по сказанному"><span class="ic">🎤</span><span class="lbl"></span></button>
  <button class="hb" id="abcBtn" aria-label="Азбука"><span class="ic">🔤</span><span class="lbl"></span></button>
  <button class="hb" id="settingsBtn" aria-label="Настройки">⚙️</button>
  <button class="hb" id="helpBtn" aria-label="Справка">❓</button>
  <button class="hb" id="gear" aria-label="Редактор">✏️</button>
</header>

<div id="stage">
  <main id="main"></main>
  <div id="ov"></div>
</div>

<nav id="bar"></nav>

<!-- Подсказка по сказанному -->
<div id="hear" class="modal"></div>

<!-- Справка -->
<div id="help" class="modal"></div>

<!-- Модальное окно Редактора -->
<div id="ed" class="modal"></div>

<!-- Модальное окно Настроек (подписи подставляются на языке меню) -->
<div id="sett" class="modal">
  <div class="helphead"><h2 data-i="s_title"></h2><button id="closeSettBtn2" data-i="s_close"></button></div>

  <h3 data-i="g_main"></h3>
  <label data-i="s_level"></label>
  <select id="setSeg"></select>
  <div class="note" id="lvNote"></div>

  <label data-i="s_gender"></label>
  <select id="setGender"></select>

  <label data-i="s_uilang"></label>
  <select id="setUiLang"></select>

  <label data-i="s_theme"></label>
  <select id="setTheme"></select>

  <h3 data-i="g_voice"></h3>
  <label data-i="s_voice"></label>
  <select id="setVoice"></select>
  <div class="note" id="voiceNote"></div>

  <label><span data-i="s_rate"></span>: <span id="rateVal" class="range-val">0.85</span></label>
  <input type="range" id="setRate" min="0.4" max="1.3" step="0.05" value="0.85">

  <label><span data-i="s_pitch"></span>: <span id="pitchVal" class="range-val">1.0</span></label>
  <input type="range" id="setPitch" min="0.5" max="1.5" step="0.1" value="1.0">

  <div class="row">
    <button id="testVoiceBtn" data-i="s_test"></button>
  </div>

  <h3 data-i="g_touch"></h3>
  <label data-i="s_size"></label>
  <select id="setSize"></select>

  <label data-i="s_guard"></label>
  <select id="setGuard"></select>

  <label data-i="s_hand"></label>
  <select id="setHand"></select>

  <label class="chk"><input type="checkbox" id="setHear"><span data-i="s_hear"></span></label>
  <label class="chk"><input type="checkbox" id="setSyll"><span data-i="s_syll"></span></label>
  <label class="chk"><input type="checkbox" id="setAbcAutoHide"><span data-i="s_abchide"></span></label>
  <label class="chk"><input type="checkbox" id="setVib"><span data-i="s_vib"></span></label>
  <label class="chk"><input type="checkbox" id="setAwake"><span data-i="s_awake"></span></label>

  <h3 data-i="g_ease"></h3>
  <label class="chk"><input type="checkbox" id="setQuick"><span data-i="s_quick"></span></label>
  <label class="chk"><input type="checkbox" id="setFreq"><span data-i="s_freq"></span></label>

  <h3 data-i="g_ext"></h3>
  <label data-i="s_ext_prov"></label>
  <select id="setExtProv"></select>
  <div id="extBox">
    <div class="note" id="extInfo"></div>
    <label data-i="s_ext_url"></label>
    <input type="text" id="setExtUrl" autocomplete="off" spellcheck="false">
    <label data-i="s_ext_model"></label>
    <input type="text" id="setExtModel" autocomplete="off" spellcheck="false">
    <label data-i="s_ext_key"></label>
    <input type="password" id="setExtKey" autocomplete="off" spellcheck="false">
    <label class="chk"><input type="checkbox" id="setExtOk"><span data-i="s_ext_ok"></span></label>
    <button class="wide" id="extTestBtn" data-i="b_ext_test"></button>
    <div class="note" id="extNote"></div>
  </div>

  <label class="chk"><input type="checkbox" id="setWordOnline"><span data-i="s_wonline"></span></label>

  <h3 data-i="g_data"></h3>
  <label data-i="s_lex"></label>
  <div class="note" id="lexInfo"></div>
  <button class="wide" id="lexGetBtn" data-i="b_lex_get"></button>
  <button class="wide" id="lexDelBtn" data-i="b_lex_del"></button>
  <div class="note" id="lexNote"></div>
  <div class="note" data-i="lex_src"></div>
  <label class="chk"><input type="checkbox" id="setLog"><span data-i="s_log"></span></label>
  <button class="wide" id="diaryBtn" data-i="b_diary"></button>
  <button class="wide" id="backupBtn" data-i="b_save"></button>
  <button class="wide" id="restoreBtn" data-i="b_load"></button>
  <input type="file" id="restoreFile" accept="application/json,.json" hidden>

  <div class="row" style="margin-top:24px">
    <button id="closeSettBtn" style="width:100%" data-i="s_close"></button>
  </div>
  <div class="note" id="ver" style="text-align:center"></div>
</div>

<!-- Дневник общения -->
<div id="diary" class="modal"></div>

<script>
const APP_VERSION = 25;   // держите в соответствии с V = 'govorim-v25' в sw.js

const $=s=>document.querySelector(s);
const h=(tag,cls,txt,fn)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;if(fn)e.onclick=fn;return e};

/* ---------- Интернационализация ---------- */
const U={
ru:{title:'Говорим вместе',freq:'Часто',yes:'Да',no:'Нет',back:'Назад',rep:'Повтор',help:'Помощь',pain:'Больно',sure:'Точно?',done:'Готово',cancel:'Отмена',mods:['сейчас','потом','ещё','хватит'],helpSay:'Помогите! Мне нужна помощь!',helpTxt:'МНЕ НУЖНА ПОМОЩЬ',
  built:'Ваша фраза',sayso:'Сказать так',cont:'Продолжите фразу — выберите слово:',pick:'Выберите тему:',ver:'Версия приложения',
  aHome:'Домой',aLang:'Язык',aSet:'Настройки',aEd:'Редактор',nomem:'Не хватает памяти',testSay:'Это проверка голоса',
  aHelp:'Справка',v_auto:'Автоматически (голос по умолчанию)',v_none:'Для этого языка в телефоне нет голосов. Как их установить — см. «Справка» → «Голос и озвучка».',
  abc:'Азбука',abcFree:'Свободный набор',abcShow:'Показать буквы',abcHide:'Скрыть буквы',abcType:'Набирайте слово так, как вы его себе представляете (можно с ошибками):',abcFit:'Подходящие буквы',abcWords:'Подходящие слова — нажмите, чтобы добавить:',abcHint:'Нажмите первую букву слова',abcNext:'Следующая буква:',abcNone:'Слов на эти буквы нет',slow:'Медленно',
  s_lex:'Словари слов для «Азбуки» и исправления искажённых слов (загружаются один раз, потом работают без интернета)',b_lex_get:'⬇️ Загрузить словари слов',b_lex_del:'🗑️ Удалить словари слов',lex_none:'не загружен',lex_words:'слов',lex_loading:'Загружаю: ',lex_done:'Готово. Словари сохранены на этом телефоне.',lex_err:'Не удалось загрузить: ',lex_confirm_del:'Удалить загруженные словари слов?',lex_src:'Источник списков: FrequencyWords (hermitdave) на основе субтитров OpenSubtitles, лицензия CC BY-SA 4.0. Нецензурные слова отфильтрованы не полностью.',

  helpDoc:{title:'❓ Справка',s:[
   ['Для чего приложение','Приложение помогает общаться с человеком, у которого после инсульта нарушена речь (афазия). Вместо того чтобы подбирать слова, достаточно нажимать на крупные плитки — телефон произнесёт фразу вслух. Всё работает без интернета.'],
   ['Быстрый старт',['Выберите тему на главном экране (например, «Еда и питьё»).','Нажимайте плитки: фраза выбирается по шагам.','Приложение спросит, например, «Я хочу чай?». Нажмите «Да» — фраза прозвучит, «Нет» — отмена.','После озвучивания можно нажать «Повтор» или «Готово».']],
   ['Кнопки вверху',['🏠 — на главный экран.','RU / UK / EN — язык фраз и озвучки. Подписи и фразы переключаются целиком, английские фразы строятся по правилам английского языка.','⚙️ — настройки.','❓ — эта справка.','✏️ — редактор плиток.']],
   ['Нижняя панель',['✔ Да / ✖ Нет — быстрые ответы. Если открыт вопрос с фразой, отвечают на него; иначе просто произносят «Да» или «Нет».','↩ Назад — шаг назад или закрыть окно.','🔊 Повтор — повторить последнюю фразу.','🆘 Помощь — красный экран и громкий призыв «Помогите!», повторяется каждые 6 секунд. «Отмена» останавливает.','🤕 Больно — сразу открывает тему «Здоровье».']],
   ['Степень нарушения речи (⚙️)',['Названия уровней относятся к человеку с афазией, а не к сложности работы с приложением: чем тяжелее нарушение речи, тем проще интерфейс. Подберите уровень по тому, как человек говорит сейчас, и меняйте его по мере восстановления.','Тяжёлое — человеку очень трудно говорить. Несколько крупных плиток с самыми нужными словами: вода, еда, туалет, больно.','Среднее — человек произносит отдельные слова. Категории и уточнение внутри них.','Лёгкое 1 — человек начинает фразу, но не вспоминает окончание: тема → начало («Я хочу») → окончание («пить воду»).','Лёгкое 2 — фраза из трёх частей: «Я хочу» → «пить» → «чай».','Лёгкое 3 — речь почти сохранена: длинные фразы до пяти частей с уточнением (когда, где, зачем, почему), в том числе в прошедшем времени: «Я уже выпила утренние таблетки после еды».']],
   ['Как собирать фразу в лёгком режиме','Выберите тему и нажимайте плитки по очереди: вверху растёт собранная фраза со знаком «…». Если человек не может вспомнить последнее слово, нажмите «Сказать так»: прозвучит то, что уже собрано, и собеседник сможет подсказать продолжение. Когда у плитки нет продолжения, появится вопрос для подтверждения.'],
   ['Уточнения «сейчас / потом / ещё / хватит»','В окне подтверждения эти кнопки добавляют слово к фразе, например «Я хочу чай сейчас». Повторное нажатие убирает уточнение.'],
   ['Пол говорящего','Чтобы фразы в прошедшем времени звучали правильно («выпила» или «выпил»), выберите пол в настройках.'],
   ['Часто используемое','На главном экране показываются до четырёх самых частых фраз — так нужное находится быстрее. Чтобы убрать ненужную фразу, нажмите ✏️ рядом с заголовком «Часто» и коснитесь фразы; «Убрать все» очищает блок. Счётчик фразы обнуляется и начнёт набираться заново, только если её снова произнести.'],
   ['Здоровье и лекарства','Темы «Здоровье» и «Лекарства» просят второе подтверждение «Точно?», чтобы случайное нажатие не ввело в заблуждение. Приложение не заменяет врача. В опасной ситуации звоните 103 (скорая помощь) или 112.'],
   ['Голос и озвучка',['Озвучку делает синтезатор речи телефона. В настройках показываются только голоса выбранного языка интерфейса.','Если голосов нет: Настройки Android → Система → Язык и ввод → Синтез речи → Google → установите голосовые данные русского или украинского языка.','Лучше немного снизить скорость речи (0,7–0,85) — так проще разобрать слова. Кнопка «Проверить голос» позволяет послушать результат.']],
   ['Азбука (подсказка по первой букве)',['Кнопка «Азбука» находится в шапке рядом с 🎤 (на тяжёлом уровне её нет). Буквы всегда закреплены внизу экрана, а найденные слова показываются над ними; кнопка «Скрыть буквы» освобождает место для слов, «Показать буквы» возвращает их. В настройках можно включить автоматическое сворачивание панели после каждой нажатой буквы: после выбора слова или удаления буквы или слова панель появляется снова.','Нажмите первую букву слова: появятся слова из словаря, которые с неё начинаются. Можно нажать следующую букву, чтобы сузить список.','Нажатие на слово добавляет его в строку фразы. «Сказать так» произносит всю строку, ⌫ убирает последнее слово.','Кнопка вверху экрана переключает режим: «Свободный набор» показывает всю азбуку, человек набирает слово так, как его себе представляет (можно с ошибками), а приложение предлагает подходящие слова и готовые фразы, как на экране 🎤. «Подходящие буквы» показывает лишь те буквы, после которых в словаре есть слова.']],
   ['Поиск слов онлайн (⚙️, бесплатно)',['Если нужного слова нет в словаре (например, «кукуруза»), включите в настройках «Искать слова онлайн». Тогда на экране «Азбука» и на экране 🎤 появится кнопка «Найти слова в интернете».','Слова ищутся в Викисловаре (для английского ещё в Datamuse): продолжения начатого слова и исправления опечаток. Ключ и регистрация не нужны. Набранные буквы и слова отправляются этим сервисам.','Выбранное слово произносится и запоминается на телефоне: дальше оно находится и без интернета.']],
   ['Словари слов (⚙️)',['В настройках можно один раз загрузить частотные списки слов (около 20 000 форм слов для русского и украинского и 10 000 для английского). После этого они хранятся на телефоне и работают без интернета.','Они расширяют «Азбуку»: на каждую букву появляются сотни самых употребительных слов, а наши слова идут первыми. На экране 🎤 они дают блок «Слова из словаря»: услышанные слова исправляются (например, «мошина» → «машина»), недоговорённое начало слова дополняется, и слово произносится по нажатию. Это работает и для слов, которых нет в наших фразах.','Списки не создают новые фразы, а только слова. Источник: FrequencyWords (hermitdave), лицензия CC BY-SA 4.0. В списках из субтитров есть шум и редкие грубые слова, фильтрация неполная.']],
   ['Подсказка по сказанному (🎤)',['Кнопка 🎤 вверху открывает экран подсказок: человек говорит фразу, а приложение находит в своём словаре слова и предлагает готовые фразы с ними.','Нажмите на подходящую фразу — она прозвучит. Для тем «Здоровье» и «Лекарства» сначала будет вопрос «Точно?».','Распознавание речи делает браузер Chrome и обычно требует интернета (запись голоса может обрабатываться на серверах Google). Без интернета впишите услышанные слова в поле вручную — подбор фраз работает и так.','Нарушенную речь распознаватель понимает плохо, поэтому подсказки приблизительные. Если фразы не нашлись, попробуйте короче или впишите слова.']],
   ['Онлайн-поиск фраз (необязательно)',['Если в словаре нет подходящей фразы, на экране 🎤 появляется кнопка «Поискать в интернете». Она отправляет распознанные слова (звук не отправляется) выбранному сервису с языковой моделью, и тот предлагает до пяти фраз.','Включение: ⚙️ → «Онлайн-поиск фраз»: выберите сервис, введите API-ключ, отметьте согласие и нажмите «Проверить соединение». Рекомендуются Anthropic Claude или OpenRouter; для ключа задайте лимит расходов.','Подсказки из интернета не проверены, поэтому после нажатия приложение сначала спрашивает «…?». Не используйте функцию, если не хотите, чтобы слова человека уходили на внешний сервис. Ключ хранится на этом телефоне и не попадает в резервную копию.']],
   ['Ситуации','На уровнях «Лёгкое 1–3» в конце главного экрана есть плитка «Ситуации»: визит к врачу, аптека, магазин, гости, телефонный разговор. Фразы в них подобраны под конкретную ситуацию. Если вы раньше правили плитки лёгкого уровня, нажмите в редакторе «Сбросить уровень», чтобы получить новые темы.'],
   ['Услышать, потом выбрать (⚙️)','Если включено, первое нажатие на плитку только произносит слово и обводит плитку жёлтой рамкой, а второе нажатие на ту же плитку выбирает её. Нажатие на другую плитку снова только озвучивает её.'],
   ['Разбор по слогам (⚙️)','Если включено, долгое нажатие на плитку открывает слово по слогам: оно произносится медленно, а нажатие на слог произносит его отдельно. Деление на слоги примерное. Используйте по рекомендации логопеда.'],
   ['Управление и защита от нажатий (⚙️)','Размер плиток (обычный, крупный, по одной в ряд); защита от случайных нажатий (повторные касания быстрее выбранного времени игнорируются); нижняя панель для правой или левой руки; вибрация; «не гасить экран».'],
   ['Меньше усталости (⚙️)','«Говорить сразу» убирает вопрос «…?»: фраза звучит после нажатия на плитку (в темах «Здоровье» и «Лекарства» вопрос остаётся). Блок «Часто» можно отключить, чтобы плитки всегда стояли на своих местах.'],
   ['Дневник общения','Открывается из настроек. На телефоне хранятся произнесённые фразы с датой и временем (последние 1000). Видны активность за 7 дней и самые частые фразы; можно сохранить текстовый файл для логопеда. Дневник можно выключить и очистить.'],
   ['Резервная копия','В настройках: «Сохранить копию данных» создаёт файл со всеми настройками, правками плиток и дневником, «Загрузить копию данных» восстанавливает их (например, на новом телефоне). Сделайте копию перед очисткой данных браузера или сменой телефона.'],
   ['Язык меню','В настройках можно задать язык меню и справки отдельно от языка фраз и озвучки: например, фразы и голос на украинском, а меню на русском. Подписи для самого человека (кнопки «Да», «Нет» и т. п.) следуют за языком фраз.'],
   ['Редактор плиток','Откройте нужный раздел (например, «Самочувствие» → «Мне» → «плохо») и нажмите ✏️: редактор откроется именно в этом разделе. Здесь можно добавить плитку («+ Добавить плитку в этот раздел»), изменить название, фразу или значок плитки, удалить ненужную. Другой раздел можно выбрать в списке. «Сбросить уровень» возвращает стандартный набор. Правки хранятся на этом устройстве. В лёгких уровнях плитка — часть фразы; формы по полу пишутся так: вып{ил~ила}.'],
   ['Установка и обновление',['В Chrome откройте меню ⋮ → «Установить приложение» (или «Добавить на главный экран»).','После первого запуска приложение работает без интернета.','Новая версия подгружается сама при открытии с интернетом. Номер версии виден внизу настроек.']],
   ['Советы по общению',['Давайте время: не торопите и не договаривайте за человека.','Задавайте вопросы, на которые можно ответить «да» или «нет».','Говорите короткими фразами, спокойно и не перебивая.','Хвалите попытки — важна сама попытка сказать, а не безошибочность.']]
  ]},
  s_title:'⚙️ Настройки',s_level:'Степень нарушения речи у человека',s_gender:'Пол говорящего (для глаголов в прошедшем времени)',s_theme:'Тема оформления',s_voice:'Голос озвучки',s_rate:'Скорость речи',s_pitch:'Высота тона',s_test:'🔊 Проверить голос',s_close:'Закрыть',
  g_f:'Женский — «выпила»',g_m:'Мужской — «выпил»',th_dark:'Тёмная 🌙',th_light:'Светлая ☀️',
  lvl:{L1:'Тяжёлое — простые слова',L2:'Среднее — категории',L3:'Лёгкое 1 — начало + окончание',L4:'Лёгкое 2 — фраза из 3 частей',L5:'Лёгкое 3 — сложные фразы'},
  lv:{L1:'Подходит, если человеку очень трудно говорить. Крупные плитки с самыми нужными словами.',L2:'Подходит, если человек произносит отдельные слова. Выбор категории, затем уточнение.',L3:'Подходит, если человек начинает фразу, но не может вспомнить окончание. Тема → начало фразы («Я хочу…») → окончание. Можно сказать и одно начало.',L4:'Подходит, если нужны фразы чуть подробнее. Тема → начало → действие → предмет; остановиться можно на любом шаге.',L5:'Подходит, если речь почти сохранена, но не хватает слов. Фразы до 5 частей с уточнением (когда, где, зачем, почему), в том числе в прошедшем времени: «Я уже выпила утренние таблетки».'},
  e_title:'✏️ Редактор',e_note:'Редактор открывается в том разделе, где вы сейчас находитесь: новые плитки добавляются именно туда. Другой раздел можно выбрать в списке ниже.',
  e_noteB:'Редактор открывается в том разделе, где вы сейчас находитесь. Лёгкие уровни: плитка — часть фразы, фраза собирается по цепочке от темы. В поле «Фраза» пишите только свою часть. Формы по полу записываются так: вып{ил~ила} (слева мужской, справа женский вариант).',

  helpDoc:{title:'❓ Довідка',s:[
   ['Для чого застосунок','Застосунок допомагає спілкуватися з людиною, у якої після інсульту порушене мовлення (афазія). Замість того щоб добирати слова, достатньо натискати великі плитки — телефон вимовить фразу вголос. Усе працює без інтернету.'],
   ['Швидкий старт',['Оберіть тему на головному екрані (наприклад, «Їжа та напої»).','Натискайте плитки: фраза обирається по кроках.','Застосунок запитає, наприклад, «Я хочу чай?». Натисніть «Так» — фраза пролунає, «Ні» — скасування.','Після озвучення можна натиснути «Повтор» або «Готово».']],
   ['Кнопки вгорі',['🏠 — на головний екран.','RU / UK / EN — мова фраз та озвучення. Підписи й фрази перемикаються повністю, англійські фрази будуються за правилами англійської мови.','⚙️ — налаштування.','❓ — ця довідка.','✏️ — редактор плиток.']],
   ['Нижня панель',['✔ Так / ✖ Ні — швидкі відповіді. Якщо відкрите запитання з фразою, відповідають на нього; інакше просто вимовляють «Так» або «Ні».','↩ Назад — крок назад або закрити вікно.','🔊 Повтор — повторити останню фразу.','🆘 Допомога — червоний екран і гучне «Допоможіть!», повторюється кожні 6 секунд. «Скасувати» зупиняє.','🤕 Болить — одразу відкриває тему «Здоров’я».']],
   ['Ступінь порушення мовлення (⚙️)',['Назви рівнів стосуються людини з афазією, а не складності роботи із застосунком: що важче порушення мовлення, то простіший інтерфейс. Підберіть рівень за тим, як людина говорить зараз, і змінюйте його в міру відновлення.','Важке — людині дуже важко говорити. Кілька великих плиток із найпотрібнішими словами: вода, їжа, туалет, болить.','Середнє — людина вимовляє окремі слова. Категорії та уточнення всередині них.','Легке 1 — людина починає фразу, але не згадує закінчення: тема → початок («Я хочу») → закінчення («пити воду»).','Легке 2 — фраза з трьох частин: «Я хочу» → «пити» → «чай».','Легке 3 — мовлення майже збережене: довгі фрази до п’яти частин з уточненням (коли, де, навіщо, чому), зокрема в минулому часі: «Я вже випила ранкові таблетки після їжі».']],
   ['Як збирати фразу в легкому режимі','Оберіть тему й натискайте плитки по черзі: угорі росте зібрана фраза зі знаком «…». Якщо людина не може згадати останнє слово, натисніть «Сказати так»: пролунає те, що вже зібрано, і співрозмовник зможе підказати продовження. Коли в плитки немає продовження, з’явиться запитання для підтвердження.'],
   ['Уточнення «зараз / потім / ще / досить»','У вікні підтвердження ці кнопки додають слово до фрази, наприклад «Я хочу чай зараз». Повторне натискання прибирає уточнення.'],
   ['Стать мовця','Щоб фрази в минулому часі звучали правильно («випила» чи «випив»), оберіть стать у налаштуваннях.'],
   ['Часто вживане','На головному екрані показуються до чотирьох найчастіших фраз — так потрібне знаходиться швидше. Щоб прибрати непотрібну фразу, натисніть ✏️ поруч із заголовком «Часто» і торкніться фрази; «Прибрати всі» очищає блок. Лічильник фрази обнуляється й почне набиратися знову, лише якщо її знову вимовити.'],
   ['Здоров’я та ліки','Теми «Здоров’я» та «Ліки» просять друге підтвердження «Точно?», щоб випадкове натискання не ввело в оману. Застосунок не замінює лікаря. У небезпечній ситуації телефонуйте 103 (швидка допомога) або 112.'],
   ['Голос і озвучення',['Озвучення виконує синтезатор мовлення телефона. У налаштуваннях показуються лише голоси обраної мови інтерфейсу.','Якщо голосів немає: Налаштування Android → Система → Мова та введення → Синтез мовлення → Google → встановіть голосові дані російської або української мови.','Краще трохи знизити швидкість мовлення (0,7–0,85) — так легше розібрати слова. Кнопка «Перевірити голос» дає змогу послухати результат.']],
   ['Абетка (підказка за першою літерою)',['Кнопка «Абетка» розташована в шапці поруч із 🎤 (на важкому рівні її немає). Літери завжди закріплені внизу екрана, а знайдені слова показуються над ними; кнопка «Сховати літери» вивільняє місце для слів, «Показати літери» повертає їх. У налаштуваннях можна ввімкнути автоматичне згортання панелі після кожної натиснутої літери: після вибору слова або видалення літери чи слова панель з’являється знову.','Натисніть першу літеру слова: з’являться слова зі словника, що з неї починаються. Можна натиснути наступну літеру, щоб звузити список.','Натискання на слово додає його до рядка фрази. «Сказати так» вимовляє весь рядок, ⌫ прибирає останнє слово.','Кнопка вгорі екрана перемикає режим: «Вільний набір» показує всю абетку, людина набирає слово так, як його собі уявляє (можна з помилками), а застосунок пропонує відповідні слова й готові фрази, як на екрані 🎤. «Відповідні літери» показує тільки ті літери, після яких у словнику є слова.']],
   ['Пошук слів онлайн (⚙️, безкоштовно)',['Якщо потрібного слова немає у словнику (наприклад, «кукурудза»), увімкніть у налаштуваннях «Шукати слова онлайн». Тоді на екрані «Абетка» та на екрані 🎤 з’явиться кнопка «Знайти слова в інтернеті».','Слова шукаються у Вікісловнику (для англійської ще в Datamuse): продовження початого слова й виправлення помилок. Ключ і реєстрація не потрібні. Набрані літери й слова надсилаються цим сервісам.','Обране слово вимовляється й запам’ятовується на телефоні: далі воно знаходиться й без інтернету.']],
   ['Словники слів (⚙️)',['У налаштуваннях можна один раз завантажити частотні списки слів (близько 20 000 форм слів для російської й української та 10 000 для англійської). Після цього вони зберігаються на телефоні й працюють без інтернету.','Вони розширюють «Абетку»: на кожну літеру з’являються сотні найуживаніших слів, а наші слова йдуть першими. На екрані 🎤 вони дають блок «Слова зі словника»: почуті слова виправляються (наприклад, «мошина» → «машина»), недоказаний початок слова доповнюється, і слово вимовляється після натискання. Це працює й для слів, яких немає в наших фразах.','Списки не створюють нових фраз, а лише слова. Джерело: FrequencyWords (hermitdave), ліцензія CC BY-SA 4.0. У списках із субтитрів є шум і рідкісні грубі слова, фільтрація неповна.']],
   ['Підказка за сказаним (🎤)',['Кнопка 🎤 угорі відкриває екран підказок: людина говорить фразу, а застосунок знаходить у своєму словнику слова й пропонує готові фрази з ними.','Натисніть на відповідну фразу — вона пролунає. Для тем «Здоров’я» та «Ліки» спочатку буде запитання «Точно?».','Розпізнавання мовлення робить браузер Chrome і зазвичай потребує інтернету (запис голосу може оброблятися на серверах Google). Без інтернету впишіть почуті слова в поле вручну — добір фраз працює й так.','Порушене мовлення розпізнавач розуміє погано, тому підказки приблизні. Якщо фрази не знайшлися, спробуйте коротше або впишіть слова.']],
   ['Онлайн-пошук фраз (необов’язково)',['Якщо у словнику немає відповідної фрази, на екрані 🎤 з’являється кнопка «Пошукати в інтернеті». Вона надсилає розпізнані слова (звук не надсилається) обраному сервісу з мовною моделлю, і той пропонує до п’яти фраз.','Увімкнення: ⚙️ → «Онлайн-пошук фраз»: оберіть сервіс, введіть API-ключ, позначте згоду й натисніть «Перевірити з’єднання». Рекомендуються Anthropic Claude або OpenRouter; для ключа задайте ліміт витрат.','Підказки з інтернету не перевірені, тому після натискання застосунок спершу запитує «…?». Не користуйтеся цією функцією, якщо не хочете, щоб слова людини йшли на зовнішній сервіс. Ключ зберігається на цьому телефоні й не потрапляє в резервну копію.']],
   ['Ситуації','На рівнях «Легке 1–3» наприкінці головного екрана є плитка «Ситуації»: візит до лікаря, аптека, магазин, гості, телефонна розмова. Фрази в них підібрано під конкретну ситуацію. Якщо ви раніше правили плитки легкого рівня, натисніть у редакторі «Скинути рівень», щоб отримати нові теми.'],
   ['Почути, потім обрати (⚙️)','Якщо увімкнено, перше натискання на плитку лише вимовляє слово й обводить плитку жовтою рамкою, а друге натискання на ту саму плитку обирає її. Натискання на іншу плитку знову лише озвучує її.'],
   ['Розбір по складах (⚙️)','Якщо увімкнено, довге натискання на плитку відкриває слово по складах: воно вимовляється повільно, а натискання на склад вимовляє його окремо. Поділ на склади приблизний. Використовуйте за рекомендацією логопеда.'],
   ['Керування й захист від натискань (⚙️)','Розмір плиток (звичайний, великий, по одній у ряд); захист від випадкових натискань (повторні торкання швидше за обраний час ігноруються); нижня панель для правої чи лівої руки; вібрація; «не гасити екран».'],
   ['Менше втоми (⚙️)','«Говорити одразу» прибирає запитання «…?»: фраза звучить після натискання на плитку (у темах «Здоров’я» та «Ліки» запитання залишається). Блок «Часто» можна вимкнути, щоб плитки завжди стояли на своїх місцях.'],
   ['Щоденник спілкування','Відкривається з налаштувань. На телефоні зберігаються вимовлені фрази з датою й часом (останні 1000). Видно активність за 7 днів і найчастіші фрази; можна зберегти текстовий файл для логопеда. Щоденник можна вимкнути й очистити.'],
   ['Резервна копія','У налаштуваннях: «Зберегти копію даних» створює файл з усіма налаштуваннями, правками плиток і щоденником, «Завантажити копію даних» відновлює їх (наприклад, на новому телефоні). Зробіть копію перед очищенням даних браузера чи зміною телефона.'],
   ['Мова меню','У налаштуваннях можна задати мову меню й довідки окремо від мови фраз та озвучення: наприклад, фрази й голос українською, а меню російською. Підписи для самої людини (кнопки «Так», «Ні» тощо) йдуть за мовою фраз.'],
   ['Редактор плиток','Відкрийте потрібний розділ (наприклад, «Самопочуття» → «Мені» → «погано») і натисніть ✏️: редактор відкриється саме в цьому розділі. Тут можна додати плитку («+ Додати плитку в цей розділ»), змінити назву, фразу або значок плитки, видалити непотрібну. Інший розділ можна обрати у списку. «Скинути рівень» повертає стандартний набір. Правки зберігаються на цьому пристрої. У легких рівнях плитка — частина фрази; форми за статтю пишуться так: вип{ив~ила}.'],
   ['Встановлення й оновлення',['У Chrome відкрийте меню ⋮ → «Установити застосунок» (або «Додати на головний екран»).','Після першого запуску застосунок працює без інтернету.','Нова версія підтягується сама під час відкриття з інтернетом. Номер версії видно внизу налаштувань.']],
   ['Поради щодо спілкування',['Давайте час: не поспішайте й не договорюйте за людину.','Ставте запитання, на які можна відповісти «так» або «ні».','Говоріть короткими фразами, спокійно й не перебиваючи.','Хваліть спроби — важлива сама спроба сказати, а не безпомилковість.']]
  ]},

  helpDoc:{title:'❓ Help',s:[
   ['What this app is for','The app helps people communicate with someone whose speech has been affected by a stroke (aphasia). Instead of searching for words, they just tap large tiles and the phone says the phrase aloud. Everything works without the internet.'],
   ['Quick start',['Choose a topic on the home screen (for example, “Food and drink”).','Tap tiles: the phrase is chosen step by step.','The app asks, for example, “I want tea?”. Tap “Yes” and the phrase is spoken; “No” cancels.','After it is spoken you can tap “Repeat” or “Done”.']],
   ['Buttons at the top',['🏠 — go to the home screen.','RU / UK / EN — language of phrases and speech. Labels and phrases switch completely, and English phrases are built by English grammar.','⚙️ — settings.','❓ — this help.','✏️ — tile editor.']],
   ['Bottom bar',['✔ Yes / ✖ No — quick answers. If a phrase question is open they answer it; otherwise they just say “Yes” or “No”.','↩ Back — one step back or close a window.','🔊 Repeat — repeat the last phrase.','🆘 Help — red screen and a loud “Help!” repeated every 6 seconds. “Cancel” stops it.','🤕 Pain — opens the Health topic at once.']],
   ['Degree of speech impairment (⚙️)',['The level names describe the person with aphasia, not how hard the app is to use: the more severe the impairment, the simpler the screen. Pick the level by how the person speaks now and change it as they recover.','Severe — speaking is very hard. A few large tiles with the most needed words: water, food, toilet, pain.','Moderate — the person says single words. Categories with details inside.','Mild 1 — the person starts a phrase but cannot recall the ending: topic → start (“I want”) → ending (“to drink water”).','Mild 2 — a phrase in three parts: “I want” → “to drink” → “tea”.','Mild 3 — speech is nearly preserved: long phrases of up to five parts with details (when, where, why), including the past tense: “I have already taken my morning pills after eating”.']],
   ['Building a phrase in the mild levels','Choose a topic and tap tiles one after another: the phrase grows at the top with “…”. If the person cannot recall the last word, tap “Say it”: what has been built so far is spoken and the other person can suggest the continuation. When a tile has no continuation, a confirmation question appears.'],
   ['Add-ons “now / later / more / enough”','In the confirmation window these buttons add a word to the phrase, for example “I want tea now”. Tap again to remove it.'],
   ['Speaker’s gender','Russian and Ukrainian past-tense verbs depend on gender (“выпила” or “выпил”). Choose it in Settings. It does not affect English phrases.'],
   ['Often used','The home screen shows up to four of the most frequent phrases so they are quicker to find. To remove an unwanted phrase, tap ✏️ next to the “Often” heading and touch the phrase; “Remove all” clears the block. The phrase’s counter is reset and starts growing again only if the phrase is spoken again.'],
   ['Health and medicines','The Health and Medicines topics ask for a second confirmation, “Sure?”, so that an accidental tap does not mislead anyone. The app does not replace a doctor. In danger, call your local emergency number (103 or 112 in Ukraine).'],
   ['Voice and speech',['Speech comes from the phone’s speech synthesizer. Settings list only the voices of the language currently used for phrases.','If there are none: Android Settings → System → Languages and input → Text-to-speech → Google → install the voice data for the language.','A slightly slower speech rate (0.7–0.85) is easier to follow. The “Test voice” button plays a sample.']],
   ['ABC (first-letter help)',['The “ABC” button is in the header next to 🎤 (it is not shown in the severe level). The letters are always pinned to the bottom of the screen and the words found appear above them; “Hide letters” makes room for more words and “Show letters” brings them back. In Settings you can turn on automatic collapsing of the panel after every letter tapped: after a word is chosen or a letter or word is deleted the panel reappears.','Tap the first letter of a word: words from the dictionary starting with it appear. Tap the next letter to narrow the list.','Tapping a word adds it to the phrase line. “Say it” speaks the whole line, ⌫ removes the last word.','The button at the top switches the mode: “Free typing” shows the whole alphabet, the person types the word as they imagine it (spelling mistakes are fine) and the app suggests matching words and ready phrases, as on the 🎤 screen. “Matching letters” shows only the letters that can follow in the vocabulary.']],
   ['Online word search (⚙️, free)',['If the word you need is not in the dictionary (for example “corn”), turn on “Look up words online” in Settings. A “Find words online” button then appears on the ABC screen and on the 🎤 screen.','Words are looked up in Wiktionary (and Datamuse for English): completions of a started word and spelling corrections. No key or sign-up is needed. The typed letters and words are sent to these services.','A chosen word is spoken and remembered on the phone, so later it is found without the internet.']],
   ['Word lists (⚙️)',['In Settings you can download frequency word lists once (about 20,000 word forms for Russian and Ukrainian and 10,000 for English). After that they are kept on the phone and work offline.','They extend ABC: each letter gets hundreds of the most common words, with our own words first. On the 🎤 screen they provide a “Words from the dictionary” block: heard words are corrected (for example “mashina” → “machine”), an unfinished word start is completed, and the word is spoken when tapped. This also works for words that are not in our phrases.','The lists provide words, not new phrases. Source: FrequencyWords (hermitdave), license CC BY-SA 4.0. Lists built from subtitles contain noise and a few rude words; the filtering is incomplete.']],
   ['Suggestions from what was said (🎤)',['The 🎤 button at the top opens a screen of suggestions: the person says a phrase and the app finds words from its vocabulary and offers ready-made phrases containing them.','Tap a matching phrase and it is spoken. For the Health and Medicines topics a “Sure?” question comes first.','Speech recognition is done by the Chrome browser and usually needs the internet (the voice recording may be processed on Google servers). Without the internet, type the words you heard into the field: the phrase matching works anyway.','Impaired speech is hard for a recognizer, so the suggestions are approximate. If nothing is found, try something shorter or type the words.']],
   ['Online phrase search (optional)',['If the vocabulary has no suitable phrase, the 🎤 screen shows a “Search online” button. It sends the recognized words (no audio) to the selected language-model service, which suggests up to five phrases.','To turn it on: ⚙️ → “Online phrase search”: choose a service, enter the API key, tick the consent box and press “Test the connection”. Anthropic Claude or OpenRouter are recommended; set a spending limit for the key.','Suggestions from the internet are not vetted, so after a tap the app first asks “…?”. Do not use this feature if you do not want the person’s words to go to an outside service. The key stays on this phone and is not included in the backup.']],
   ['Situations','In the Mild 1–3 levels the last tile of the home screen is “Situations”: doctor visit, pharmacy, store, guests, phone call. The phrases are chosen for each situation. If you edited tiles of a mild level earlier, tap “Reset level” in the editor to get the new topics.'],
   ['Hear first, then choose (⚙️)','When on, the first tap on a tile only says the word and outlines the tile in yellow; a second tap on the same tile selects it. Tapping another tile only says that one.'],
   ['Syllable view (⚙️)','When on, a long press on a tile shows the word in syllables: it is spoken slowly and tapping a syllable says it alone. The syllable split is approximate. Use on a speech therapist’s advice.'],
   ['Controls and tap protection (⚙️)','Tile size (normal, large, one per row); accidental-tap protection (repeat taps faster than the chosen time are ignored); bottom bar for the right or left hand; vibration; “keep screen on”.'],
   ['Less fatigue (⚙️)','“Speak immediately” removes the “…?” question: the phrase is spoken right after the tap (in Health and Medicines the question stays). The “Often” block can be turned off so tiles always stay in place.'],
   ['Communication diary','Opens from Settings. The phone stores the spoken phrases with date and time (the last 1000). You can see activity over 7 days and the most frequent phrases, and save a text file for a speech therapist. The diary can be turned off and cleared.'],
   ['Backup','In Settings, “Save a data backup” creates a file with all settings, tile edits and the diary; “Load a data backup” restores them (for example, on a new phone). Make a backup before clearing browser data or changing phones.'],
   ['Menu language','Settings let you choose the menu and help language separately from the language of phrases and speech: for example, phrases and voice in Ukrainian and the menu in English. The labels meant for the person (“Yes”, “No”, etc.) follow the phrase language.'],
   ['Tile editor','Open the section you need (for example, “Feelings” → “I feel” → “cold”) and tap ✏️: the editor opens in that very section. You can add a tile (“+ Add a tile to this section”), change its name, phrase or icon, or delete one. Choose another section from the list. “Reset level” restores the standard set. Edits are kept on this device. English and Russian/Ukrainian phrases are stored separately in the mild levels, so edit them in the language you are using. In the mild levels a tile is a part of a phrase.'],
   ['Install and updates',['In Chrome open the menu ⋮ → “Install app” (or “Add to Home screen”).','After the first launch the app works without the internet.','A new version loads by itself when the app is opened online. The version number is at the bottom of Settings.']],
   ['Tips for communicating',['Give time: do not rush or finish the person’s sentences.','Ask questions that can be answered with “yes” or “no”.','Speak in short phrases, calmly and without interrupting.','Praise attempts: the effort to speak matters more than being error-free.']]

const SEE={'I want':'🙋',"I don't want":'🙅','I need':'❗','Give me':'🤲','Bring me':'🎁','Help me':'🤝','My':'👤','I feel':'💭','Where':'📍','When':'🕒','Who':'🧑','What':'❔','How':'🤔','How much':'🔢','Why':'🤷','Let\'s':'👐','Turn on':'🔛','Turn off':'📴','Please':'🙏','Wait':'✋','Show me':'👀','I have already':'✅',"I haven't":'⏳','Thank you':'🙏','I am':'🙋','Would you':'☕','Buy me':'🛒','Remind me':'⏰','It was':'🕰️','It\'s':'🌦️','Dial':'📞','Send':'💬','Hello':'📞','Open':'🪟','Close':'🚪','I forgot':'🤔','Tomorrow':'📅','Call':'📲'};

function buildPhraseTree(lv){
  const EN=lang==='en';
  const {n,max}=BL[lv],topics=[],idx={},groups={};let cur=null;
  (EN?CORPUS_EN:CORPUS).split('\n').forEach(raw=>{
    const line=raw.trim();if(!line)return;
    if(line.startsWith('##')){
      const f=line.slice(2).split('|').map(x=>x.trim());
      let id,name,e,col,crit,grp;
      if(EN){[id,name,e,col,crit,grp]=f}else{let ru,uk;[id,ru,uk,e,col,crit,grp]=f;name=ru+'|'+uk}
      cur={id,col,l:name,s:name,e,c:[],tp:1};if(crit)cur.crit=1;
      if(grp){                                   // тема внутри группы (например, «Ситуации»)
        let g=groups[grp];
        const gn=EN?'Situations':'Ситуации|Ситуації';
        if(!g){g=groups[grp]={id:grp,col:'#5A5A8A',l:gn,s:gn,e:'🎭',c:[],tp:1};topics.push(g)}
        g.c.push(cur);
      }else topics.push(cur);
      return;
    }
    const sp=line.indexOf(' '),e=line.slice(0,sp);
    let a,b;
    if(EN){a=line.slice(sp+1).split('/');b=a.slice()}
    else{const [ru,uk]=line.slice(sp+1).split(' = ');a=ru.split('/');b=uk.split('/')}
    if(a.length>max)return;                       // слишком длинная фраза для этого уровня
    if(a.length>n){                                // склеиваем «хвост» в одну плитку
      a=[...a.slice(0,n-1),a.slice(n-1).join(' ')];
      b=[...b.slice(0,n-1),b.slice(n-1).join(' ')];
    }
    const SEM=EN?SEE:SE;
    let node=cur,id=cur.id;
    a.forEach((p,k)=>{
      id+='>'+p;let ch=idx[id];
      const lab=EN?p:p+'|'+b[k];
      if(!ch){ch={id,l:lab,s:lab,e:(k===0&&SEM[p])||e,c:[]};idx[id]=ch;node.c.push(ch)}
      if(k===a.length-1&&!(k===0&&SEM[p]))ch.e=e;
      node=ch;
    });
  });
  const clean=l=>l.forEach(x=>{if(x.c.length)clean(x.c);else delete x.c});clean(topics);
  return topics;
}

function getTreeForLevel(){
  if(settings.level === 'L1') return DEF_L1();
  if(isB()) return buildPhraseTree(settings.level);
  return DEF_L2();
}

// Ключ хранения. Для конструктора — новый ключ, чтобы не подхватить старые правки прежнего «Лёгкого» уровня
const tk=()=>(isB()?'aac.tree2_':'aac.tree_')+settings.level+(isB()&&lang==='en'?'_en':'');

let tree = ld(tk(), null) || getTreeForLevel();
let use = ld('aac.use', {});
let path = [], last = '', cn = null, stage = 0, mod = '', tmr = null, sel = '';

const save = () => {
  try {
    localStorage.setItem(tk(), JSON.stringify(tree));
  } catch(e){ alert(u('nomem')); }
};

const flat=()=>{const r=[];const w=(l,top,ch)=>l.forEach(n=>{const tp=top||n,c2=[...ch,n];r.push({n,top:tp,chain:c2});if(n.c)w(n.c,tp,c2)});w(tree,null,[]);return r};
const score=id=>{const x=use[id];return x?x.n*Math.pow(.9,(Date.now()-x.t)/864e5):0};
const bump=id=>{use[id]={n:score(id)+1,t:Date.now()};try{localStorage.setItem('aac.use',JSON.stringify(use))}catch(e){}};

// Фраза, собранная по цепочке плиток (без плиток-тем): «ru|uk»
const tpIdx=ch=>{let k=-1;ch.forEach((n,i)=>{if(n.tp)k=i});return k};
const parts=ch=>ch.slice(Math.max(tpIdx(ch),0)+1);
const phr=ch=>{const a=parts(ch).map(n=>String(n.s||'').split('|'));return [0,1,2].map(i=>a.map(x=>x[i]||x[0]).join(' ')).join('|')};
const synth=ch=>{const n=ch[ch.length-1],p=phr(ch);return {id:n.id,l:p,s:p,e:n.e}};

/* ---------- Синтез речи (SpeechSynthesis) ---------- */
// Голос подходит, если его язык совпадает с текущим языком интерфейса (ru-RU, uk-UA, ru_RU ...)
const voiceOk=v=>v.lang.toLowerCase().replace('_','-').startsWith(lang);
function getVoices(){
  if(!('speechSynthesis' in window)) return [];
  return speechSynthesis.getVoices();
}

function speak(txt,f){
  if(!('speechSynthesis' in window))return;
  speechSynthesis.cancel();
  const m = new SpeechSynthesisUtterance(txt);
  m.lang = {ru:'ru-RU',uk:'uk-UA',en:'en-US'}[lang];
  m.rate = Math.max(0.1, (parseFloat(settings.rate) || 0.85) * (f || 1));
  m.pitch = parseFloat(settings.pitch) || 1.0;

  const voices = getVoices();
  const chosen = (settings.voices || {})[lang];
  const v = (chosen && voices.find(x => x.voiceURI === chosen && voiceOk(x))) || voices.find(voiceOk);
  try{ if(v) m.voice = v; }catch(e){}
  speechSynthesis.speak(m);
}

/* ---------- Отрисовка интерфейса ---------- */
let armed=null, longUntil=0, abc=null, freqEdit=false;
const saveUse=()=>{try{localStorage.setItem('aac.use',JSON.stringify(use))}catch(e){}};

function tile(n,top,fn){
  const b=h('button','tile',null);b.style.setProperty('--c',top.col||'#1E3A8A');
  if(n.img){const i=h('img');i.src=n.img;i.alt='';b.append(i)}else b.append(h('span','em',n.e||'💬'));
  b.append(h('span',null,t(n.l)));
  // «Сначала услышать, потом выбрать»: первое нажатие произносит слово, второе выбирает плитку
  b.onclick=()=>{
    if(settings.hear&&armed!==b){
      if(armed)armed.classList.remove('armed');
      armed=b;b.classList.add('armed');speak(t(n.l));return;
    }
    armed=null;fn();
  };
  // Долгое нажатие: слово по слогам и медленное произношение
  if(settings.syll){
    let tm=null,sx=0,sy=0;
    const stop=()=>{if(tm){clearTimeout(tm);tm=null}};
    b.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY;stop();tm=setTimeout(()=>{tm=null;longUntil=Date.now()+500;showSyll(t(n.l))},600)});
    b.addEventListener('pointermove',e=>{if(Math.abs(e.clientX-sx)>10||Math.abs(e.clientY-sy)>10)stop()});
    ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,stop));
    b.addEventListener('contextmenu',e=>e.preventDefault());
  }
  return b;
}

function render(){
  armed=null;
  document.body.classList.toggle('at-home',!path.length&&!abc);   // на главном экране кнопка 🎤 крупная
  if(path.length||abc)freqEdit=false;
  if(abc){renderAbc();return}
  const B=isB();
  const m=$('#main'),c=path.length?path[path.length-1]:null;m.innerHTML='';m.scrollTop=0;
  const pp=(c&&B)?parts(path):[];
  const topics=path.filter(n=>n.tp);
  $('#ttl').textContent=!c?u('title'):(B?(topics.length?topics:[path[0]]).map(n=>t(n.l)).join(' › '):path.map(n=>t(n.l)).join(' › '));

  if(c&&B){
    if(pp.length){
      const more=c.c&&c.c.length;
      const bx=h('div','build');
      bx.append(h('div','bl',u('built')),h('div','bt',t(phr(path))+(more?' …':'')));
      m.append(bx,h('button','say','🔊 '+u('sayso'),()=>ask(synth(path))));
      if(more)m.append(h('div','sec',u('cont')));
    }
  }else if(c){
    m.append(h('button','say','🔊 '+t(c.s),()=>ask(c)));
  }else if(settings.level !== 'L1'){
    if(settings.freq){
      const fr=flat().filter(x=>(B?parts(x.chain).length>0:!x.n.c)&&score(x.n.id)>=1).sort((a,b)=>score(b.n.id)-score(a.n.id)).slice(0,4);
      if(!fr.length)freqEdit=false;
      if(fr.length){
        const hd=h('div','sec fh');
        hd.append(h('span',null,u('freq')));
        const eb=h('button','mini',freqEdit?'✔':'✏️',()=>{freqEdit=!freqEdit;render()});
        eb.setAttribute('aria-label',freqEdit?uh('f_done'):uh('f_edit'));
        hd.append(eb);
        m.append(hd);
        if(freqEdit){
          m.append(h('p','note',uh('f_hint')));
          m.append(h('button','mini',uh('f_clear'),()=>{if(confirm(uh('f_cclear'))){fr.forEach(x=>delete use[x.n.id]);saveUse();freqEdit=false;render()}}));
        }
        const g=h('div','grid');
        fr.forEach(x=>{
          let tl=B?tile({l:phr(x.chain),e:x.n.e},x.top,()=>ask(synth(x.chain))):tile(x.n,x.top,()=>ask(x.n));
          if(freqEdit){                       // режим удаления: плитка без озвучки, касание убирает её из блока
            tl=tl.cloneNode(true);tl.classList.add('del');
            tl.onclick=()=>{delete use[x.n.id];saveUse();render()};
          }
          g.append(tl);
        });
        m.append(g,h('div','sec',' '));
      }
    }
    if(B)m.append(h('div','sec',u('pick')));
  }

  const g=h('div','grid');
  (c?c.c:tree).forEach(n=>g.append(tile(n,path[0]||n,()=>{
    if(n.c&&n.c.length){path.push(n);render()}
    else{const ch=[...path,n];ask(B&&parts(ch).length?synth(ch):n)}
  })));
  m.append(g);

/* ---------- Азбука: подсказка по первой букве ---------- */
const ALPHA={ru:'абвгдежзийклмнопрстуфхцчшщэюя',uk:'абвгґдеєжзиіїйклмнопрстуфхцчшщюя',en:'abcdefghijklmnopqrstuvwxyz'};
function buildDict(){
  const cnt={};
  const add=txt=>String(txt).toLowerCase().split(/[\s,.!?…:;«»"()—–]+/).forEach(w=>{
    w=w.replace(/^[-'’ʼ]+|[-]+$/g,'');
    if(w.length>=2&&/^[\p{L}'’ʼ-]+$/u.test(w))cnt[w]=(cnt[w]||0)+1;
  });
  (lang==='en'?CORPUS_EN:CORPUS).split('\n').forEach(raw=>{
    const line=raw.trim();if(!line||line.startsWith('##'))return;
    const p=line.slice(line.indexOf(' ')+1).split(' = ');
    add(G(p[lang==='uk'?1:0]).replace(/\//g,' '));
  });
  flat().forEach(x=>{add(t(x.n.l));add(t(x.n.s))});
  const own=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]||a.localeCompare(b,lang));
  const lx=getLex();
  if(!lx)return own;
  const have=new Set(own);
  return own.concat(lx.words.filter(w=>!have.has(w)));
}

// Полная азбука для свободного набора (включая буквы, которых нет в начале слов)
const ALPHA_FULL={ru:'абвгдеёжзийклмнопрстуфхцчшщъыьэюя',uk:'абвгґдеєжзиіїйклмнопрстуфхцчшщьюя\'',en:'abcdefghijklmnopqrstuvwxyz\''};
// Слова словаря, похожие на набранное (даже с ошибками): точное, начало слова, начало с опечаткой, слово с опечаткой
function abcFuzzy(typed,dict){
  const q=norm(typed).replace(/[\s-]+/g,'');
  if(!q)return [];
  const L=q.length,out=[];
  dict.forEach((w,i)=>{
    let cat=9,d=0;
    if(w===q)cat=0;
    else if(w.startsWith(q))cat=1;
    else if(L>=3&&w.length>=L-1){
      const dp=levw(q,w.slice(0,L),L<=3?0.5:1);
      if(dp<=(L<=3?0.5:1)){cat=2;d=dp}
      else if(L>=4&&Math.abs(w.length-L)<=2){
        const maxd=L<=4?1:L<=6?1.5:2,df=levw(q,w,maxd);
        if(df<=maxd){cat=3;d=df}
      }
    }
    if(cat<9)out.push([cat,d,i,w]);
  });
  out.sort((a,b)=>a[0]-b[0]||a[1]-b[1]||a[2]-b[2]);
  return out.slice(0,12).map(x=>x[3]);
}

/* ---------- Слоги (примерное деление) ---------- */
const VOW={ru:'аеёиоуыэюя',uk:'аеєиіїоуюя',en:'aeiouy'};
// Английский: группы гласных считаются одним слогом, конечное «e» после согласной не читается
function enSyllables(word){
  const lw=word.toLowerCase(),isV=i=>VOW.en.includes(lw[i]),nuc=[];
  for(let i=0;i<lw.length;){
    if(isV(i)){let j=i;while(j<lw.length&&isV(j))j++;nuc.push([i,j]);i=j}else i++;
  }
  const last=nuc[nuc.length-1];
  if(nuc.length>1&&last[1]===lw.length&&lw[last[0]]==='e'&&last[1]-last[0]===1&&last[0]>0&&!isV(last[0]-1)&&lw.length>3)nuc.pop();
  if(nuc.length<2)return [word];
  const cuts=[];
  for(let k=0;k<nuc.length-1;k++){
    const a=nuc[k][1],b=nuc[k+1][0],n=b-a;
    cuts.push(n<=1?b-n:a+1);
  }
  const out=[];let from=0;
  cuts.forEach(c=>{out.push(word.slice(from,c));from=c});
  out.push(word.slice(from));
  return out.filter(Boolean);
}
function syllables(word){
  if(lang==='en')return enSyllables(word);
  const lw=word.toLowerCase(),V=VOW[lang],idx=[];
  for(let i=0;i<lw.length;i++)if(V.includes(lw[i]))idx.push(i);
  if(idx.length<2)return [word];
  const cuts=[];
  for(let k=0;k<idx.length-1;k++){
    let a=idx[k]+1;const b=idx[k+1];
    while(a<b&&"йьъ'’ʼ".includes(lw[a]))a++;      // й, ь, ъ и апостроф остаются в предыдущем слоге
    const n=b-a;
    cuts.push(n<=1?b-n:a+1);                       // 0–1 согласная — слог начинается с неё, больше — после первой
  }
  const out=[];let from=0;
  cuts.forEach(c=>{out.push(word.slice(from,c));from=c});
  out.push(word.slice(from));
  return out.filter(Boolean);
}

function ask(n){

/* ---------- Словари слов (частотные списки FrequencyWords) ---------- */
const LEXB={};              // слова из файлов репозитория (lex/*.txt)
// Объём: для русского и украинского с их формами слов нужно больше, чем для английского
const LEX_N={ru:20000,uk:20000,en:10000};
const LEX_BASE='https://raw.githubusercontent.com/hermitdave/FrequencyWords/master/content/2018/';
const LEX_RE={
  ru:/^[а-я]+(?:-[а-я]+)?$/,
  uk:/^[а-щьюяєіїґ]+(?:['’ʼ-][а-щьюяєіїґ]+)?$/,
  en:/^[a-z]+(?:'[a-z]+)?$/
};
// Простая фильтрация нецензурной лексики (не исчерпывающая): списки собраны из субтитров
const LEX_BAD={
  ru:/хуй|хуе|хуи|хуя|пизд|бляд|бляц|блят|залуп|муда[кч]|пидор|пидар|гандон|шлюх|дерьм|говн|^(?:за|вы|по|на|съ|от|у|до|об|раз|рас|при)?еб|^жоп|^сук[аиуе]$/,
  uk:/хуй|хуї|хує|пизд|бляд|курв|гівн|мудак|підор|підар|шлюх|^жоп|^сук[аиуе]$|^(?:за|ви|по|на|від|у|до|об|роз|при)?їб/,
  en:/fuck|shit|cunt|bitch|asshole|pussy|whore|slut|bastard|nigg|^dick$|^cock$|^fag/
};
const LEXC={};              // кэш в памяти: язык → {words, rank, byLen}
const LEXTRY={};            // для каких языков уже пробовали файлы из репозитория
function cleanLex(lines,l,n){
  const out=[],seen=new Set();
  for(const raw of lines){
    let w=String(raw).trim().split(/\s+/)[0];
    if(!w)continue;
    w=w.toLowerCase().replace(/ё/g,'е');
    if(w.length<2||w.length>20||!LEX_RE[l].test(w)||LEX_BAD[l].test(w)||seen.has(w))continue;
    seen.add(w);out.push(w);
    if(out.length>=n)break;
  }
  return out;
}
function buildLex(words){
  const rank=new Map(),byLen={};
  words.forEach((w,i)=>{if(!rank.has(w)){rank.set(w,i);(byLen[w.length]=byLen[w.length]||[]).push(w)}});
  return {words,rank,byLen};
}
// Список текущего (или указанного) языка: загруженный на телефон или файл из репозитория, плюс «выученные» слова
function getLex(l){
  l=l||lang;
  if(LEXC[l])return LEXC[l];
  let base=[];
  try{const raw=localStorage.getItem('aac.lex.'+l);if(raw)base=raw.split('\n').filter(Boolean)}catch(e){}
  if(!base.length&&LEXB[l])base=LEXB[l];
  const learned=getLearned(l);
  if(!base.length&&!learned.length)return null;
  return LEXC[l]=buildLex(learned.concat(base));
}
async function loadBundledLex(l){
  if(LEXB[l]||LEXTRY[l])return;
  LEXTRY[l]=true;
  try{
    const res=await fetch('lex/'+l+'.txt');
    if(!res.ok)return;
    const w=cleanLex((await res.text()).split('\n'),l,LEX_N[l]);
    if(w.length>=500){LEXB[l]=w;delete LEXC[l]}
  }catch(e){}
}
/* ---------- Онлайн-поиск слов (бесплатно, без ключа): Викисловарь, для английского ещё Datamuse ---------- */
const WIKI={ru:'https://ru.wiktionary.org/w/api.php',uk:'https://uk.wiktionary.org/w/api.php',en:'https://en.wiktionary.org/w/api.php'};
async function jget(url,ms){
  const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),ms||10000);
  try{
    const r=await fetch(url,{signal:ctl.signal});
    if(!r.ok){const e=new Error('http');e.status=r.status;throw e}
    return await r.json();
  }finally{clearTimeout(tm)}
}
const okWord=(w,l)=>{w=String(w||'').toLowerCase().replace(/ё/g,'е');return w.length>=2&&w.length<=24&&LEX_RE[l].test(w)&&!LEX_BAD[l].test(w)?w:null};
// Слова, которые «выучило» приложение (выбранные из онлайн-результатов): хранятся на телефоне и входят в словарь
function getLearned(l){try{return JSON.parse(localStorage.getItem('aac.learn.'+l))||[]}catch(e){return []}}
function learnWord(w){
  w=okWord(w,lang);if(!w)return;
  const a=getLearned(lang).filter(x=>x!==w);a.unshift(w);
  try{localStorage.setItem('aac.learn.'+lang,JSON.stringify(a.slice(0,3000)))}catch(e){}

}
async function onlineWords(q){
  q=norm(q).replace(/[\s-]+/g,'');
  if(q.length<2)return [];
  const enc=encodeURIComponent,base=WIKI[lang],out=[];
  const add=w=>{w=okWord(w,lang);if(w&&!out.includes(w))out.push(w)};
  const near=t=>{t=okWord(t,lang);return t&&(t.startsWith(q)||levw(q,t,2)<=2)};
  const tasks=[
    // продолжения слова
    jget(base+'?action=query&list=prefixsearch&pssearch='+enc(q)+'&pslimit=10&format=json&origin=*')
      .then(j=>((j.query&&j.query.prefixsearch)||[]).forEach(x=>add(x.title))),
    // «возможно, вы имели в виду» и похожие названия статей
    jget(base+'?action=query&list=search&srsearch='+enc(q)+'&srnamespace=0&srlimit=8&srinfo=suggestion&srprop=&format=json&origin=*')
      .then(j=>{
        const s=j.query&&j.query.searchinfo&&j.query.searchinfo.suggestion;
        if(s)String(s).split(/\s+/).forEach(add);
        ((j.query&&j.query.search)||[]).forEach(x=>{if(near(x.title))add(x.title)});
      })
  ];
  if(lang==='en')tasks.push(jget('https://api.datamuse.com/sug?s='+enc(q)+'&max=10').then(a=>(a||[]).forEach(x=>add(x.word))));
  const res=await Promise.allSettled(tasks);
  if(res.every(r=>r.status==='rejected'))throw res[0].reason;
  out.sort((a,b)=>(b===q)-(a===q)||(b.startsWith(q))-(a.startsWith(q))||levw(q,a,3)-levw(q,b,3));
  return out.slice(0,10);
}

// Читаем только первые строки большого файла и сразу закрываем поток, чтобы не качать лишнего
async function fetchLines(url,maxLines){
  const res=await fetch(url);
  if(!res.ok){const e=new Error('http');e.status=res.status;throw e}
  const out=[];
  if(res.body&&res.body.getReader){
    const rd=res.body.getReader(),dec=new TextDecoder();let buf='';
    while(out.length<maxLines){
      const {done,value}=await rd.read();
      if(done)break;
      buf+=dec.decode(value,{stream:true});
      const parts=buf.split('\n');buf=parts.pop();
      for(const ln of parts){out.push(ln);if(out.length>=maxLines)break}
    }
    try{rd.cancel()}catch(e){}
    if(out.length<maxLines&&buf)out.push(buf);
  }else out.push(...(await res.text()).split('\n').slice(0,maxLines));
  return out;
}
async function downloadLexicons(onStatus){

  }

}

/* ---------- Подсказка по сказанному (распознавание речи + подбор фраз) ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const hearEl=$('#hear');
let rec=null, hearTxt='', hearAlt='', IDX=[];
const STOPW={ru:'я и в на не мне мой моя с по у это что а но да',uk:'я і в на не мені мій моя з по у це що а але',en:'i the a an to my me is it of in on and am are'};
const norm=x=>String(x).toLowerCase().replace(/ё/g,'е').replace(/[’ʼ`]/g,"'").replace(/[^\p{L}\p{N}'\s-]/gu,' ');
const toks=x=>norm(x).split(/[\s-]+/).map(w=>w.replace(/^'+|'+$/g,'')).filter(Boolean);
// Буквы, которые часто путают в речи и при распознавании: замена стоит полцены
const CONF=new Set('бп пб вф фв гк кг дт тд жш шж зс сз ао оа еи ие яи ия еэ эе уы ыу иі ії bp pb dt td kg gk sz zs fv vf'.split(' '));
function levw(a,b,max){
  const n=a.length,m=b.length,lim=max||99;
  if(Math.abs(n-m)>lim)return 99;
  let prev=Array.from({length:m+1},(_,j)=>j);
  for(let i=1;i<=n;i++){
    const cur=[i];let rowMin=i;
    for(let j=1;j<=m;j++){
      const ca=a[i-1],cb=b[j-1],sub=ca===cb?0:(CONF.has(ca+cb)?0.5:1);
      const v=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+sub);
      cur.push(v);if(v<rowMin)rowMin=v;
    }
    if(rowMin>lim)return 99;
    prev=cur;
  }
  return prev[m];
}
// Похожесть двух слов: 1 — совпадают, ~0.8 — общее начало (падежи, формы), ~0.7 — одна ошибка
function wordSim(a,b){
  if(a===b)return 1;
  const m=Math.min(a.length,b.length);
  if(m<3)return 0;
  let p=0;while(p<m&&a[p]===b[p])p++;
  if(p>=3&&p/m>=0.6)return 0.8;
  const dist=levw(a,b,2);
  if(Math.max(a.length,b.length)>=4&&dist<=1)return 0.7;
  if(Math.max(a.length,b.length)>=7&&dist<=2)return 0.55;
  return 0;
}
// Все известные приложению фразы текущего языка: словарь целиком + плитки текущего дерева (включая добавленные вручную)
function phraseIndex(){
  const out=[],seen=new Set();
  const add=(text,e,crit)=>{
    const k=norm(text).replace(/\s+/g,' ').trim();
    if(!k||seen.has(k))return;
    seen.add(k);out.push({text,e,crit:!!crit,w:toks(text)});
  };
  let crit=false;
  (lang==='en'?CORPUS_EN:CORPUS).split('\n').forEach(raw=>{
    const line=raw.trim();if(!line)return;
    if(line.startsWith('##')){const f=line.slice(2).split('|').map(x=>x.trim());crit=!!(lang==='en'?f[4]:f[5]);return}
    const sp=line.indexOf(' '),pp=line.slice(sp+1).split(' = ');
    add(G(pp[lang==='uk'?1:0]).replace(/\//g,' '),line.slice(0,sp),crit);
  });
  const B=isB();
  flat().forEach(x=>{
    if(x.n.c&&x.n.c.length)return;               // начала фраз и темы — не готовые фразы
    const text=B?(parts(x.chain).length?t(phr(x.chain)):''):t(x.n.s);
    if(text)add(text,x.n.e,x.top.crit);
  });
  return out;
}
// Варианты исправления слова по большому словарю: только для слов, которых в словаре нет
function lexRepairs(w,wide){
  const lx=getLex();
  if(!lx||w.length<(wide?3:4)||(!wide&&lx.rank.has(w)))return [];
  const maxd=w.length>=7?(wide?2:1.5):w.length>=5?(wide?1.5:1):1,out=[];
  for(let L=w.length-2;L<=w.length+2;L++){
    const arr=lx.byLen[L];if(!arr)continue;
    for(const v of arr){const d=levw(w,v,maxd);if(d<=maxd)out.push([v,d,lx.rank.get(v)])}
  }
  out.sort((x,y)=>x[1]-y[1]||x[2]-y[2]);
  const res=out.slice(0,3).map(x=>x[0]);
  if(wide){                                        // недоговорённое начало слова: самые частые продолжения
    let k=0;
    for(const v of lx.words){if(v.length>w.length&&v.startsWith(w)&&!res.includes(v)){res.push(v);if(++k>=2)break}}
  }
  return res;
}
// Слова из словаря для показа на экране: услышанное слово, его исправления и продолжения
function lexWords(text){
  const lx=getLex();if(!lx)return [];
  const stop=new Set((STOPW[lang]||'').split(' ')),out=[],seen=new Set();
  for(const w of [...new Set(toks(text))]){
    if(w.length<2||stop.has(w))continue;
    const cand=lx.rank.has(w)?[w]:lexRepairs(w,true);
    cand.forEach(c=>{if(!seen.has(c)){seen.add(c);out.push({word:c,from:w})}});
  }
  return out.slice(0,8);
}
function suggest(text){
  const all=toks(text),stop=new Set((STOPW[lang]||'').split(' '));
  let tk=[...new Set(all.filter(w=>!stop.has(w)&&w.length>1))];
  if(!tk.length)tk=[...new Set(all.filter(w=>w.length>1))];
  if(!tk.length)return [];
  // у каждого услышанного слова: оно само (вес 1) и исправления из большого словаря (вес 0,9)
  const groups=tk.map(w=>[[w,1],...lexRepairs(w).map(r=>[r,0.9])]);
  const res=[];
  for(const c of IDX){
    let m=0;const used=new Set();
    for(const g of groups){
      let best=0,bi=-1;
      c.w.forEach((v,i)=>{if(used.has(i))return;for(const [w,f] of g){const sm=wordSim(w,v)*f;if(sm>best){best=sm;bi=i}}});
      if(bi>=0&&best>=0.5){used.add(bi);m+=best}
    }
    if(m<0.7)continue;
    res.push({c,score:2*m/(groups.length+c.w.length)+0.05*m});
  }
  res.sort((a,b)=>b.score-a.score||a.c.text.length-b.c.text.length);
  return res.slice(0,6).map(x=>x.c);
}

const EXT_DEF={anthropic:{url:'https://api.anthropic.com',model:'claude-haiku-5-5'},openai:{url:'https://api.openai.com/v1',model:''}};

// Ответ модели: JSON-массив (в том числе внутри ```), объект с полем-списком или маркированный список. jsonOnly — без разбора свободного текста

    .map(l=>l.replace(/^\s*(?:[-*•]|\d+[.)])\s+/,'').replace(/^["«“'`]+|["»”'`,]+$/g,'').trim())
    .filter(l=>l&&l.length<=100&&l.split(/\s+/).length<=10);

    let r=parsePhrases(out,false);
    if(!r.length&&reasoning)r=parsePhrases(reasoning,true);
    if(!r.length)extDiag='finish: '+(finish||'?')+'; '+(String(out||reasoning).replace(/\s+/g,' ').slice(0,160)||'(пусто)');
    return r;
  }finally{clearTimeout(tm)}
}
function extErr(e){
  const add=e&&e.apiMsg?' ['+String(e.apiMsg).slice(0,160)+']':'';
  if(e&&e.cfg)return uh('ext_ecfg');
  if(e&&e.name==='AbortError')return uh('ext_etime');
  const st=Number(e&&e.status);
  if(/data policy/i.test((e&&e.apiMsg)||''))return uh('ext_policy')+add;
  if(st===401||st===403)return uh('ext_e401')+add;
  if(st===429)return uh('ext_e429')+add;
  if(st)return uh('ext_eother')+st+add;
  return uh('ext_enet');
}
let hearExt;                                   // undefined — не искали, 'loading', массив фраз или {err}
async function runExt(){
  const heard=hearTxt.trim(),alts=hearAlt.trim();
  hearExt='loading';refreshHear();
  try{hearExt=await extSuggest(heard,alts)}catch(e){hearExt={err:extErr(e)}}
  refreshHear();
}

function stopRec(){if(rec){try{rec.abort()}catch(e){}rec=null}}
function closeHear(){stopRec();hearEl.style.display='none'}
function hearStatus(msg){const e=$('#hearSt');if(e)e.textContent=msg||''}
function refreshHear(){
  const box=$('#hearSug');if(!box)return;
  box.innerHTML='';
  const text=(hearTxt+' '+hearAlt).trim();
  if(!text)return;
  const list=suggest(text);
  if(!list.length)box.append(h('p',null,u('m_none')));
  else{
    box.append(h('h3',null,u('m_sugg')));
    list.forEach(c=>{
      const b=h('button','sug',null,()=>pickSug(c));
      b.append(h('span','em',c.e||'💬'),h('span',null,c.text));
      box.append(b);
    });
  }
  // Слова из словаря (исправленные и дополненные)
  const lw=lexWords(text);
  if(lw.length){
    box.append(h('h3',null,u('m_words')));
    const g=h('div','grid');
    lw.forEach(x=>{
      const b=h('button','wd',null,()=>{closeHear();say(x.word)});
      b.append(h('span',null,x.word));
      if(x.from!==x.word)b.append(h('span','note',' ← '+x.from));
      g.append(b);
    });
    box.append(g);
  }else if(!list.length&&!getLex())box.append(h('p','note',uh('m_lex_off')));
  // Онлайн-поиск слов: для первого услышанного слова, которого нет ни в словаре, ни в наших фразах
  const lxw=getLex(),known=new Set(IDX.flatMap(c=>c.w)),stopw=new Set((STOPW[lang]||'').split(' '));
  const unk=toks(text).filter(w=>w.length>=2&&!stopw.has(w)&&!known.has(w)&&!(lxw&&lxw.rank.has(w)));
  const q1=unk[0]||toks(text).filter(w=>w.length>=2&&!stopw.has(w)).slice(-1)[0];
  onlineBlock(box,'h:'+q1,q1,w=>{learnWord(w);closeHear();say(w)},refreshHear);
  // Онлайн-поиск: только по нажатию и только если включён в настройках
  const ex=h('div');box.append(ex);
  if(extReady()){
    if(hearExt===undefined){
      const eb=h('button',list.length?'mini':'ans neu sm','🌐 '+u('m_online'),runExt);
      eb.style.width='100%';eb.style.margin='10px 0';ex.append(eb);
    }else if(hearExt==='loading')ex.append(h('p','note',u('m_searching')));
    else if(hearExt.err)ex.append(h('p','note',hearExt.err));
    else if(!hearExt.length)ex.append(h('p','note',u('m_online_none')+(extDiag?' ('+uh('ext_diag')+': '+extDiag+')':'')));
    else{
      ex.append(h('h3',null,u('m_online_res')));
      hearExt.forEach(t2=>{
        const b=h('button','sug',null,()=>{closeHear();ask({id:'x:'+t2,s:t2,l:t2,e:'🌐'})});   // непроверенная фраза: сначала вопрос «…?»
        b.append(h('span','em','🌐'),h('span',null,t2));
        ex.append(b);
      });
    }
  }else if(!list.length)ex.append(h('p','note',uh('m_ext_off')));
}
// Выбор подсказки: сразу произносим; в темах с двойным подтверждением сначала спрашиваем «Точно?»
function pickSug(c){
  closeHear();
  if(c.crit)ask({id:'m:'+c.text,s:c.text,l:c.text,e:c.e,crit:1});
  else say(c.text);
}
function toggleListen(){
  const mic=$('#micGo');
  if(rec){try{rec.stop()}catch(e){}return}
  if(!SR){hearStatus(u('m_nosr'));$('#hearIn').focus();return}
  const r=new SR();
  r.lang={ru:'ru-RU',uk:'uk-UA',en:'en-US'}[lang];
  r.interimResults=true;r.maxAlternatives=5;r.continuous=false;
  if(!navigator.onLine&&'processLocally' in r){try{r.processLocally=true}catch(e){}}   // распознавание на устройстве, если поддерживается
  let err='';
  r.onstart=()=>{mic.textContent='⏹ '+u('m_stop');mic.classList.add('rec');hearStatus(u('m_listen'))};
  r.onresult=e=>{
    const rs=Array.from(e.results);
    hearTxt=rs.map(x=>x[0].transcript).join(' ').trim();
    hearAlt=rs.map(x=>Array.from(x).slice(1).map(a=>a.transcript).join(' ')).join(' ');
    hearExt=undefined;$('#hearIn').value=hearTxt;refreshHear();
  };
  r.onerror=e=>{
    err=e.error;
    hearStatus(err==='not-allowed'||err==='service-not-allowed'?u('m_nomic'):err==='network'||err==='language-not-supported'?u('m_net'):err==='no-speech'?u('m_nosp'):u('m_err'));
  };
  r.onend=()=>{
    rec=null;mic.textContent='🎤 '+u('m_say');mic.classList.remove('rec');
    if(!err){hearStatus(hearTxt?'':u('m_nosp'))}
  };
  rec=r;
  try{r.start()}catch(e){rec=null;hearStatus(u('m_err'))}
}
