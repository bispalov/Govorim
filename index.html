/* ---------- Дневник общения: экран ---------- */
const diaryEl=$('#diary');
const locale=()=>({ru:'ru-RU',uk:'uk-UA',en:'en-GB'}[uiL()]);
const fmtDT=ts=>new Date(ts).toLocaleString(locale(),{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
const dayKey=ts=>{const d=new Date(ts);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
function diaryStats(){
  const a=ld('aac.log',[]),cnt={},days={};
  a.forEach(x=>{cnt[x.s]=(cnt[x.s]||0)+1;const k=dayKey(x.t);days[k]=(days[k]||0)+1});
  const top=Object.entries(cnt).sort((x,y)=>y[1]-x[1]).slice(0,10);
  const week=[];
  for(let i=6;i>=0;i--){const k=dayKey(Date.now()-i*864e5);week.push([k.slice(8)+'.'+k.slice(5,7),days[k]||0])}
  return {a,top,week,nd:Object.keys(days).length};
}
function download(name,text,type){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;
  document.body.append(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);
}
const today=()=>dayKey(Date.now());
function drawDiary(){
  const S=diaryStats();
  diaryEl.innerHTML='';
  const head=h('div','helphead');
  head.append(h('h2',null,uh('d_title')),h('button',null,uh('s_close'),()=>{diaryEl.style.display='none'}));
  diaryEl.append(head);
  if(!settings.log)diaryEl.append(h('p','note',uh('d_off')));
  if(!S.a.length){diaryEl.append(h('p',null,uh('d_empty')));return}
  diaryEl.append(h('p',null,uh('d_total')+': '+S.a.length+' · '+uh('d_days')+': '+S.nd));
  diaryEl.append(h('h3',null,uh('d_week')));
  const mx=Math.max(1,...S.week.map(x=>x[1])),bars=h('div','bars');
  S.week.forEach(([d,n])=>{const col=h('div','col');const bar=h('i');bar.style.height=(n?Math.round(n/mx*64)+4:0)+'px';col.append(h('span',null,n?String(n):''),bar,h('span',null,d));bars.append(col)});
  diaryEl.append(bars,h('h3',null,uh('d_top')));
  S.top.forEach(([s2,n])=>{const r=h('div','dl');r.append(h('span',null,s2),h('b',null,'×'+n));diaryEl.append(r)});
  diaryEl.append(h('h3',null,uh('d_recent')));
  S.a.slice(-30).reverse().forEach(x=>{const r=h('div','dl');r.append(h('span',null,x.s),h('span','note',fmtDT(x.t)));diaryEl.append(r)});
  const row=h('div','row');
  row.append(h('button',null,uh('d_export'),()=>{
    const lines=[uh('d_exp_title'),fmtDT(Date.now()),'',uh('d_total')+': '+S.a.length,'',uh('d_top')+':'];
    S.top.forEach(([s2,n])=>lines.push('  '+s2+' ×'+n));
    lines.push('',uh('d_recent')+':');
    S.a.forEach(x=>lines.push(fmtDT(x.t)+'  '+x.s));
    download('govorim-diary-'+today()+'.txt',lines.join('\n'),'text/plain;charset=utf-8');
  }),h('button','d',uh('d_clear'),()=>{if(confirm(uh('d_cclear'))){try{localStorage.removeItem('aac.log')}catch(e){}drawDiary()}}));
  diaryEl.append(row);
}
$('#diaryBtn').onclick=()=>{drawDiary();diaryEl.style.display='block';diaryEl.scrollTop=0};

$('#backupBtn').onclick=()=>{
  const data={};
  for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith('aac.')&&!k.startsWith('aac.secret.')&&!k.startsWith('aac.lex.'))data[k]=localStorage.getItem(k)}

$('#restoreBtn').onclick=()=>$('#restoreFile').click();
$('#restoreFile').onchange=e=>{
  const f=e.target.files&&e.target.files[0];e.target.value='';
  if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    let j;try{j=JSON.parse(r.result)}catch(_){j=null}
    if(!j||j.app!=='govorim'||!j.data||typeof j.data!=='object'){alert(uh('b_bad'));return}
    if(!confirm(uh('b_confirm')))return;
    const old=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith('aac.')&&!k.startsWith('aac.secret.')&&!k.startsWith('aac.lex.'))old.push(k)}
    old.forEach(k=>localStorage.removeItem(k));
    Object.entries(j.data).forEach(([k,v])=>{if(k.startsWith('aac.')&&!k.startsWith('aac.secret.')&&!k.startsWith('aac.lex.')&&typeof v==='string'){try{localStorage.setItem(k,v)}catch(_){}}});
    location.reload();
  };
  r.readAsText(f);
};

const ed=$('#ed');
let edCtx='';                                   // раздел, в котором открыт редактор
$('#gear').onclick = () => openEd();
const find=id=>{let r=null;const w=(l)=>l.forEach(n=>{if(n.id===id)r={n,l};if(n.c)w(n.c)});w(tree);return r};
// Редактор открывается в разделе, который сейчас открыт на экране
// Языки, в которых хранятся тексты плиток текущего дерева
const edLangs=()=>isB()?(lang==='en'?['en']:['ru','uk']):['ru','uk','en'];
function openEd(){
  edCtx=(!abc&&path.length)?path[path.length-1].id:'';
  sel='';ed.style.display='block';ed.scrollTop=0;drawEd();
}
function closeEd(){
  ed.style.display='none';
  const ok=[];for(const n of path){if(find(n.id))ok.push(n);else break}   // убрать из пути удалённые разделы
  path=ok;closeOv();render();
}
function drawEd(){
  ed.innerHTML='';
  const eh=h('div','helphead');
  eh.append(h('h2',null,uh('e_title')),h('button',null,uh('e_close'),closeEd));
  ed.append(eh,h('p','note',isB()?uh('e_noteB'):uh('e_note')));

  // 1. Раздел
  if(edCtx&&!find(edCtx))edCtx='';
  const cs=h('select');cs.append(new Option(uh('e_main'),''));
  const w=(l,d)=>l.forEach(n=>{cs.append(new Option('· '.repeat(d)+t(n.l)+' '+(n.e||''),n.id));if(n.c)w(n.c,d+1)});w(tree,0);
  cs.value=edCtx;cs.onchange=()=>{edCtx=cs.value;sel='';drawEd()};
  ed.append(h('label',null,uh('e_sec')),cs);
  const cf=edCtx&&find(edCtx);
  const kids=cf?(cf.n.c||[]):tree;
  if(isB()&&cf){
    const x=flat().find(y=>y.n.id===edCtx);
    if(x&&parts(x.chain).length)ed.append(h('p','note',uh('e_phr')+': «'+t(phr(x.chain))+' …»'));
  }

  // 2. Плитка раздела
  const ts=h('select');ts.append(new Option(uh('e_pick'),''));
  kids.forEach(n=>ts.append(new Option(t(n.l)+' '+(n.e||''),n.id)));
  ts.value=sel;if(ts.value!==sel){sel='';ts.value=''}
  ts.onchange=()=>{sel=ts.value;drawEd()};
  ed.append(h('label',null,uh('e_tiles')),ts);

  const f=sel&&find(sel);
  const fld=(lb,val)=>{const i=h('input');i.type='text';i.value=val;ed.append(h('label',null,lb),i);return i};
  const LS=edLangs(), one=LS.length===1;
  const pick=(str,c)=>{const p=String(str||'').split('|');return p[one?0:LI_IDX[c]]||''};
  const join=vals=>one?vals[0]:LS.map((c,i)=>vals[i]).join('|');
  let fl=[],fp=[],ie;
  if(f){
    const n=f.n;
    fl=LS.map(c=>fld(uh('e_name')+' ('+uh('ln_'+c)+')',pick(n.l,c)));
    fp=LS.map(c=>fld(uh('e_phrase')+' ('+uh('ln_'+c)+')',pick(n.s,c)));
    ie=fld(uh('e_em'),n.e||'');
  }
  const r=h('div','row');
  if(f){
    r.append(h('button',null,uh('e_save'),()=>{const n=f.n;n.l=join(fl.map(i=>i.value));n.s=join(fp.map(i=>i.value));n.e=ie.value;save();drawEd()}));
    r.append(h('button','d',uh('e_del'),()=>{if(confirm(uh('e_cdel'))){f.l.splice(f.l.indexOf(f.n),1);sel='';save();drawEd()}}));
  }
  ed.append(r);
  const ra=h('div','row');
  ra.append(h('button',null,uh('e_add'),()=>{
    const mk=(ru,uk,en)=>{const v={ru,uk,en};return edLangs().map(c=>v[c]).join('|')};
    const n={id:'n'+Date.now(),l:mk('Новая','Нова','New'),s:isB()?mk('слово','слово','word'):mk('Я хочу','Я хочу','I want'),e:'💬'};
    if(kids.some(k=>k.tp))n.tp=1;               // тема верхнего уровня или тема внутри группы
    if(cf){(cf.n.c=cf.n.c||[]).push(n)}else{n.col='#1E3A8A';tree.push(n)}
    sel=n.id;save();drawEd();
  }));
  ed.append(ra);
  const r2=h('div','row');
  r2.append(h('button','d',uh('e_reset'),()=>{
    if(confirm(uh('e_creset'))){
      try{localStorage.removeItem(tk())}catch(e){}
      tree=getTreeForLevel();sel='';edCtx='';path=[];drawEd();
    }}));
  ed.append(r2);
  const r3=h('div','row');
  r3.append(h('button',null,uh('e_close'),closeEd));
  ed.append(r3);
}

/* ---------- Офлайн-режим и автообновление ---------- */
if('serviceWorker' in navigator){
  const hadController = !!navigator.serviceWorker.controller;
  let reloaded = false;
  // Когда новая версия взяла управление — один раз перезагружаем страницу, чтобы показать её
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(!hadController||reloaded)return;
    reloaded=true;location.reload();
  });
  addEventListener('load',()=>{
    navigator.serviceWorker.register('/Govorim/sw.js',{scope:'/Govorim/',updateViaCache:'none'})
      .then(reg=>{
        reg.update().catch(()=>{});
        document.addEventListener('visibilitychange',()=>{if(!document.hidden)reg.update().catch(()=>{})});
      }).catch(()=>{});
  });
}
