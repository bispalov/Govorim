<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12181F">
<link rel="manifest" href="/Govorim/manifest.json">
<link rel="icon" href="/Govorim/icon-192.png">
<title>Говорим вместе</title>
<style>
:root {
  --ink: #EEF2F5;
  --bg: #12181F;
  --card-bg: #1E293B;
  --navy: #1E3A8A;
  --accent: #3B82F6;
  --border: #334155;
}

[data-theme="light"] {
  --ink: #14202B;
  --bg: #EEF2F5;
  --card-bg: #FFFFFF;
  --navy: #16384F;
  --accent: #2563EB;
  --border: #CBD5E1;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;margin:0;max-width:100%;overflow-x:hidden;background:var(--bg);color:var(--ink);font:600 20px/1.2 system-ui,Roboto,sans-serif;-webkit-text-size-adjust:100%;text-size-adjust:100%;transition:background 0.2s, color 0.2s}
body{display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
:focus-visible{outline:4px solid #F2B705;outline-offset:2px}

/* Шапка: название — отдельной строкой, кнопки — ниже на всю ширину */
header{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;padding:8px 10px;background:var(--navy);color:#fff}
header h1{order:-1;flex:1 0 100%;min-width:0;margin:0;padding:2px 4px 0;font-size:clamp(18px,5.6vw,24px);line-height:1.15;overflow-wrap:anywhere;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;overflow:hidden}
.hb{flex:1 1 0;min-width:0;min-height:50px;border-radius:14px;background:#ffffff26;color:#fff;font-size:24px;display:flex;align-items:center;justify-content:center}
@media (min-width:640px){
  header{flex-wrap:nowrap}
  header h1{order:0;flex:1 1 auto;padding:0;font-size:24px}
  .hb{flex:0 0 56px;min-height:56px}
}

#stage{flex:1;position:relative;min-height:0}
main{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,140px),1fr));gap:10px}
.sec{margin:8px 2px 4px;font-size:18px;opacity:.8;font-weight:700}

.tile{min-width:0;min-height:120px;border-radius:18px;border:3px solid var(--c);background:color-mix(in srgb, var(--c) 20%, var(--card-bg));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:8px 6px;font-size:clamp(15px,4.8vw,22px);font-weight:700;text-align:center;overflow-wrap:break-word;color:var(--ink)}
.tile .em{font-size:clamp(40px,12vw,52px);line-height:1}
.tile img,.big img{width:80px;height:80px;object-fit:cover;border-radius:12px}

.say{width:100%;min-height:64px;margin-bottom:10px;border-radius:16px;background:var(--navy);color:#fff;font-size:clamp(18px,5.4vw,22px);padding:10px;text-align:left;overflow-wrap:anywhere}

.build{padding:10px 14px;margin-bottom:10px;border-radius:16px;border:2px dashed var(--border);background:var(--card-bg)}
.build .bl{font-size:14px;opacity:.7;font-weight:700;margin-bottom:2px}
.build .bt{font-size:clamp(22px,6.6vw,30px);font-weight:800;line-height:1.2;overflow-wrap:anywhere}

#ov{position:absolute;inset:0;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:14px;text-align:center;overflow-y:auto;overflow-x:hidden;z-index:5}
#ov.red{background:#B3261E;color:#fff}
.big{max-width:100%;font-size:clamp(24px,7.4vw,30px);font-weight:800;line-height:1.15;overflow-wrap:anywhere}
.big .em{font-size:clamp(60px,20vw,80px);display:block}
.big img{width:140px;height:140px}

.row{display:flex;gap:10px;width:100%;flex-wrap:wrap;justify-content:center}
.chip{min-height:52px;padding:0 16px;border-radius:26px;background:var(--card-bg);border:2px solid var(--navy);color:var(--ink);font-size:18px}
.chip.on{background:var(--navy);color:#fff}

.ans{flex:1 1 130px;min-width:0;min-height:96px;border-radius:20px;font-size:clamp(22px,7vw,28px);color:#fff;font-weight:800}
.yes{background:#1F7A4D}.no{background:#B3261E}.neu{background:var(--navy)}

/* Нижняя панель: 6 равных колонок, ничего не вылезает за экран */
#bar{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;padding:6px 4px;background:var(--card-bg);border-top:2px solid var(--border)}
#bar button{min-width:0;min-height:64px;padding:2px 1px;border-radius:12px;font-size:clamp(8px,2.6vw,12px);letter-spacing:-.2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:color-mix(in srgb, var(--navy) 15%, var(--card-bg));color:var(--ink);font-weight:700;overflow:hidden}
#bar button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#bar .i{font-size:clamp(20px,6vw,24px)}
#bar .yes{background:#1F7A4D;color:#fff}
#bar .no{background:#B3261E;color:#fff}
#bar .hp{background:#B3261E;color:#fff}

/* Модальные окна: Редактор и Настройки */
.modal{position:fixed;inset:0;background:var(--bg);color:var(--ink);display:none;overflow-y:auto;overflow-x:hidden;padding:16px;padding-top:max(16px,env(safe-area-inset-top));padding-bottom:max(16px,env(safe-area-inset-bottom));z-index:20;font-size:17px;font-weight:500}
.modal h2{margin-top:0;font-size:24px}
.modal label{display:block;margin:12px 0 4px;font-weight:700}
.modal input[type=text],.modal input[type=range],.modal select{width:100%;font:inherit;padding:10px;border:2px solid var(--border);border-radius:10px;background:var(--card-bg);color:var(--ink)}
.modal .row{margin:14px 0}
.modal button{min-height:50px;padding:0 16px;border-radius:12px;background:var(--navy);color:#fff;font-weight:700}
.modal button.d{background:#B3261E}
.modal .note{opacity:.75;font-size:15px}
.range-val{float:right;font-weight:normal;opacity:0.8}
</style>
</head>
<body>
<header>
  <button class="hb" id="home" aria-label="Домой">🏠</button>
  <h1 id="ttl"></h1>
  <button class="hb" id="lang" aria-label="Язык">RU</button>
  <button class="hb" id="settingsBtn" aria-label="Настройки">⚙️</button>
  <button class="hb" id="gear" aria-label="Редактор">✏️</button>
</header>

<div id="stage">
  <main id="main"></main>
  <div id="ov"></div>
</div>

<nav id="bar"></nav>

<!-- Модальное окно Редактора -->
<div id="ed" class="modal"></div>

<!-- Модальное окно Настроек (все подписи подставляются на текущем языке) -->
<div id="sett" class="modal">
  <h2 data-i="s_title"></h2>

  <label data-i="s_level"></label>
  <select id="setSeg"></select>
  <div class="note" id="lvNote"></div>

  <label data-i="s_gender"></label>
  <select id="setGender"></select>

  <label data-i="s_theme"></label>
  <select id="setTheme"></select>

  <label data-i="s_voice"></label>
  <select id="setVoice"></select>

  <label><span data-i="s_rate"></span>: <span id="rateVal" class="range-val">0.85</span></label>
  <input type="range" id="setRate" min="0.4" max="1.3" step="0.05" value="0.85">

  <label><span data-i="s_pitch"></span>: <span id="pitchVal" class="range-val">1.0</span></label>
  <input type="range" id="setPitch" min="0.5" max="1.5" step="0.1" value="1.0">

  <div class="row">
    <button id="testVoiceBtn" data-i="s_test"></button>
  </div>

  <div class="row" style="margin-top:24px">
    <button id="closeSettBtn" style="width:100%" data-i="s_close"></button>
  </div>
  <div class="note" id="ver" style="text-align:center"></div>
</div>

<script>
const APP_VERSION = 5;   // держите в соответствии с V = 'govorim-v5' в sw.js

const $=s=>document.querySelector(s);
const h=(tag,cls,txt,fn)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;if(fn)e.onclick=fn;return e};

/* ---------- Интернационализация ---------- */
const U={
ru:{title:'Говорим вместе',freq:'Часто',yes:'Да',no:'Нет',back:'Назад',rep:'Повтор',help:'Помощь',pain:'Больно',sure:'Точно?',done:'Готово',cancel:'Отмена',mods:['сейчас','потом','ещё','хватит'],helpSay:'Помогите! Мне нужна помощь!',helpTxt:'МНЕ НУЖНА ПОМОЩЬ',
  built:'Ваша фраза',sayso:'Сказать так',cont:'Продолжите фразу — выберите слово:',pick:'Выберите тему:',ver:'Версия приложения',
  aHome:'Домой',aLang:'Язык',aSet:'Настройки',aEd:'Редактор',nomem:'Не хватает памяти',testSay:'Это проверка голоса',
  s_title:'⚙️ Настройки',s_level:'Уровень сложности',s_gender:'Пол говорящего (для глаголов в прошедшем времени)',s_theme:'Тема оформления',s_voice:'Голос озвучки',s_rate:'Скорость речи',s_pitch:'Высота тона',s_test:'🔊 Проверить голос',s_close:'Закрыть',
  g_f:'Женский — «выпила»',g_m:'Мужской — «выпил»',th_dark:'Тёмная 🌙',th_light:'Светлая ☀️',
  lvl:{L1:'Тяжёлый — простые слова',L2:'Средний — категории',L3:'Лёгкий 1 — начало + окончание',L4:'Лёгкий 2 — фраза из 3 частей',L5:'Лёгкий 3 — сложные фразы'},
  lv:{L1:'Крупные плитки с самыми нужными словами.',L2:'Выбор категории, затем уточнение.',L3:'Тема → начало фразы («Я хочу…») → окончание. Если слово не вспомнилось — можно сказать начало.',L4:'Тема → начало → действие → предмет. Фраза собирается по частям, можно остановиться на любом шаге.',L5:'Длинные фразы до 5 частей: действие, предмет, уточнение (когда, где, зачем, почему), в том числе в прошедшем времени: «Я уже выпила утренние таблетки».'},
  e_title:'✏️ Редактор',e_note:'Управление плитками словаря текущего уровня.',
  e_noteB:'Лёгкие уровни: плитка — часть фразы, фраза собирается по цепочке от темы. В поле «Фраза» пишите только свою часть. Формы по полу записываются так: вып{ил~ила} (слева мужской, справа женский вариант).',
  e_tile:'Плитка',e_main:'— Главный экран —',e_nl:'Название (русский)',e_nu:'Название (украинский)',e_pl:'Фраза (русский)',e_pu:'Фраза (украинский)',e_em:'Значок (эмодзи)',
  e_save:'Сохранить',e_del:'Удалить',e_add:'+ Добавить плитку',e_cdel:'Удалить плитку?',e_reset:'Сбросить уровень к стандартному',
  e_creset:'Вернуть стандартный набор плиток для этого уровня? Ваши правки будут удалены.',e_close:'Закрыть редактор'},
uk:{title:'Говоримо разом',freq:'Часто',yes:'Так',no:'Ні',back:'Назад',rep:'Повтор',help:'Допомога',pain:'Болить',sure:'Точно?',done:'Готово',cancel:'Скасувати',mods:['зараз','потім','ще','досить'],helpSay:'Допоможіть! Мені потрібна допомога!',helpTxt:'МЕНІ ПОТРІБНА ДОПОМОГА',
  built:'Ваша фраза',sayso:'Сказати так',cont:'Продовжте фразу — оберіть слово:',pick:'Оберіть тему:',ver:'Версія застосунку',
  aHome:'Додому',aLang:'Мова',aSet:'Налаштування',aEd:'Редактор',nomem:'Не вистачає пам’яті',testSay:'Це перевірка голосу',
  s_title:'⚙️ Налаштування',s_level:'Рівень складності',s_gender:'Стать мовця (для дієслів минулого часу)',s_theme:'Тема оформлення',s_voice:'Голос озвучення',s_rate:'Швидкість мовлення',s_pitch:'Висота тону',s_test:'🔊 Перевірити голос',s_close:'Закрити',
  g_f:'Жіноча — «випила»',g_m:'Чоловіча — «випив»',th_dark:'Темна 🌙',th_light:'Світла ☀️',
  lvl:{L1:'Важкий — прості слова',L2:'Середній — категорії',L3:'Легкий 1 — початок + закінчення',L4:'Легкий 2 — фраза з 3 частин',L5:'Легкий 3 — складні фрази'},
  lv:{L1:'Великі плитки з найпотрібнішими словами.',L2:'Вибір категорії, потім уточнення.',L3:'Тема → початок фрази («Я хочу…») → закінчення. Якщо слово не згадалось — можна сказати початок.',L4:'Тема → початок → дія → предмет. Фраза збирається по частинах, можна зупинитися на будь-якому кроці.',L5:'Довгі фрази до 5 частин: дія, предмет, уточнення (коли, де, навіщо, чому), зокрема в минулому часі: «Я вже випила ранкові таблетки».'},
  e_title:'✏️ Редактор',e_note:'Керування плитками словника поточного рівня.',
  e_noteB:'Легкі рівні: плитка — частина фрази, фраза збирається ланцюжком від теми. У полі «Фраза» пишіть лише свою частину. Форми за статтю записуються так: вип{ив~ила} (ліворуч чоловіча, праворуч жіноча форма).',
  e_tile:'Плитка',e_main:'— Головний екран —',e_nl:'Назва (російською)',e_nu:'Назва (українською)',e_pl:'Фраза (російською)',e_pu:'Фраза (українською)',e_em:'Значок (емодзі)',
  e_save:'Зберегти',e_del:'Видалити',e_add:'+ Додати плитку',e_cdel:'Видалити плитку?',e_reset:'Скинути рівень до стандартного',
  e_creset:'Повернути стандартний набір плиток для цього рівня? Ваші правки буде видалено.',e_close:'Закрити редактор'}};
let lang=localStorage.getItem('aac.lang')||'ru';
const u=k=>U[lang][k];
// Формы по полу: вып{ил~ила} — слева мужской, справа женский вариант
const G=s=>s.replace(/\{([^~}]*)~([^}]*)\}/g,(m,a,b)=>settings.gender==='m'?a:b);
const t=s=>{const p=String(s||'').split('|');return G(lang==='uk'&&p[1]?p[1]:p[0])};

/* ---------- Настройки ---------- */
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
let settings = ld('aac.settings', {
  theme: 'dark',
  level: 'L2',
  rate: 0.85,
  pitch: 1.0,
  voiceURI: '',
  gender: 'f'
});
if(settings.gender!=='m') settings.gender = 'f';
if(!['L1','L2','L3','L4','L5'].includes(settings.level)) settings.level = 'L2';

function applyTheme(){
  document.documentElement.setAttribute('data-theme', settings.theme);
  const themeMeta = $('meta[name="theme-color"]');
  if(themeMeta) themeMeta.setAttribute('content', settings.theme === 'dark' ? '#12181F' : '#16384F');
}
applyTheme();

/* ---------- Словари под разные уровни нарушения речи ---------- */
const L=(l,s,e)=>({id:'d'+Math.random().toString(36).slice(2,8),l,s,e});

// L1: Тяжёлая степень — пиктограммы прямого действия
const DEF_L1 = () => [
  {id:'drink_1',col:'#2B6CB0',l:'Вода|Вода',s:'Я хочу пить|Я хочу пити',e:'💧'},
  {id:'eat_1',col:'#C27C0E',l:'Еда|Їжа',s:'Я хочу есть|Я хочу їсти',e:'🍽️'},
  {id:'wc_1',col:'#0F8B8D',l:'Туалет|Туалет',s:'Мне нужно в туалет|Мені потрібно в туалет',e:'🚽'},
  {id:'pain_1',col:'#B3261E',l:'Больно|Болить',s:'Мне больно|Мені боляче',e:'🤕'},
  {id:'bed_1',col:'#8A6D00',l:'Лечь|Лягти',s:'Я хочу лечь|Я хочу лягти',e:'🛏️'},
  {id:'cold_1',col:'#B83280',l:'Холодно|Холодно',s:'Мне холодно|Мені холодно',e:'🥶'},
  {id:'hot_1',col:'#C27C0E',l:'Жарко|Жарко',s:'Мне жарко|Мені гаряче',e:'🥵'},
  {id:'bad_1',col:'#6B46C1',l:'Плохо|Погано',s:'Мне плохо|Мені погано',e:'🤢'}
];

// L2: Средняя степень — категориальная структура
const DEF_L2 = () => [
{id:'drink',col:'#2B6CB0',l:'Пить|Пити',s:'Я хочу пить|Я хочу пити',e:'🥤',c:[
 L('Вода|Вода','Я хочу воды|Я хочу води','💧'),L('Чай|Чай','Я хочу чай|Я хочу чай','🍵'),L('Кофе|Кава','Я хочу кофе|Я хочу каву','☕'),
 L('Сок|Сік','Я хочу сок|Я хочу сік','🧃'),L('Молоко|Молоко','Я хочу молоко|Я хочу молоко','🥛')]},
{id:'eat',col:'#C27C0E',l:'Есть|Їсти',s:'Я хочу есть|Я хочу їсти',e:'🍽️',c:[
 L('Суп|Суп','Я хочу суп|Я хочу суп','🍲'),L('Каша|Каша','Я хочу кашу|Я хочу кашу','🥣'),L('Хлеб|Хліб','Я хочу хлеб|Я хочу хліб','🍞'),
 L('Мясо|М\'ясо','Я хочу мясо|Я хочу м\'ясо','🍗'),L('Фрукты|Фрукти','Я хочу фрукты|Я хочу фрукти','🍎')]},
{id:'wc',col:'#0F8B8D',l:'Туалет|Туалет',s:'Мне нужно в туалет|Мені потрібно в туалет',e:'🚻',c:[
 L('Туалет|Туалет','Мне нужно в туалет|Мені потрібно в туалет','🚽'),L('Умыться|Вмитися','Я хочу умыться|Я хочу вмитися','🚿'),
 L('Душ|Душ','Я хочу в душ|Я хочу в душ','🛁')]},
{id:'pain',col:'#B3261E',crit:1,l:'Болит|Болить',s:'У меня что-то болит|У мене щось болить',e:'🤕',c:[
 L('Голова|Голова','У меня болит голова|У мене болить голова','🧠'),L('Сердце|Серце','У меня болит сердце|У мене болить серце','❤️'),
 L('Живот|Живіт','У меня болит живот|У мене болить живіт','🤢'),L('Спина|Спина','У меня болит спина|У мене болить спина','🧍')]},
{id:'ppl',col:'#2F855A',l:'Люди|Люди',s:'Я хочу поговорить|Я хочу поговорити',e:'👥',c:[
 L('Позвонить|Подзвонити','Я хочу позвонить|Я хочу подзвонити','📱'),L('Врач|Лікар','Мне нужен врач|Мені потрібен лікар','👩‍⚕️'),
 L('Тишина|Тиша','Я хочу побыть в тишине|Я хочу побути в тиші','🤫')]}
];

/* ---------- Лёгкий режим: конструктор фраз (L3 / L4 / L5) ----------
   Формат строки:  эмодзи  части по-русски = части по-украински
   Части разделены «/». Первая часть — начало фразы, остальные — продолжение.
   Фразы с общим началом объединяются в дерево автоматически.
   Строка «## id|Тема|Тема uk|эмодзи|цвет|1» начинает новую тему (1 = двойное подтверждение).
   Уровни:  L3 — 2 шага (начало + окончание, фразы до 3 частей),

// Эмодзи для самых частых начал фраз
const SE={'Я хочу':'🙋','Я не хочу':'🙅','Мне нужно':'❗','Мне нужен':'❗','Мне нужна':'❗','Мне нужны':'❗','Дай мне':'🤲','Принеси мне':'🎁','Помоги мне':'🤝','У меня':'👤','Мне':'💭','Меня':'💭','Где':'📍','Когда':'🕒','Кто':'🧑','Что':'❔','Как':'🤔','Какой':'📅','Какое':'📅','Который':'🕒','Куда':'🧭','Сколько':'🔢','Почему':'🤷','Давай':'👐','Включи':'🔛','Выключи':'📴','Сделай':'🛠️','Открой':'🪟','Закрой':'🚪','Позвоните':'📞','Вызовите':'🚑','Напиши':'💬','Набери':'📞','Купи':'🛒','Нужно':'❗','На улице':'🌦️','Я':'🙋','Напомни':'⏰','Покажи':'👀','Я уже':'✅','Я ещё не':'⏳','Таблетки':'💊'};

function buildPhraseTree(lv){
  const {n,max}=BL[lv],topics=[],idx={};let cur=null;
  CORPUS.split('\n').forEach(raw=>{
    const line=raw.trim();if(!line)return;
    if(line.startsWith('##')){
      const [id,ru,uk,e,col,crit]=line.slice(2).split('|').map(x=>x.trim());
      cur={id,col,l:ru+'|'+uk,s:ru+'|'+uk,e,c:[]};if(crit)cur.crit=1;topics.push(cur);return;
    }
    const sp=line.indexOf(' '),e=line.slice(0,sp),[ru,uk]=line.slice(sp+1).split(' = ');
    let a=ru.split('/'),b=uk.split('/');
    if(a.length>max)return;                       // слишком длинная фраза для этого уровня
    if(a.length>n){                                // склеиваем «хвост» в одну плитку
      a=[...a.slice(0,n-1),a.slice(n-1).join(' ')];
      b=[...b.slice(0,n-1),b.slice(n-1).join(' ')];
    }
    let node=cur,id=cur.id;
    a.forEach((p,k)=>{
      id+='>'+p;let ch=idx[id];
      if(!ch){ch={id,l:p+'|'+b[k],s:p+'|'+b[k],e:(k===0&&SE[p])||e,c:[]};idx[id]=ch;node.c.push(ch)}
      if(k===a.length-1&&!(k===0&&SE[p]))ch.e=e;
      node=ch;
    });
  });
  const clean=l=>l.forEach(x=>{if(x.c.length)clean(x.c);else delete x.c});clean(topics);
  return topics;
}

function getTreeForLevel(){
  if(settings.level === 'L1') return DEF_L1();
  if(isB()) return buildPhraseTree(settings.level);
  return DEF_L2();
}

// Ключ хранения. Для конструктора — новый ключ, чтобы не подхватить старые правки прежнего «Лёгкого» уровня
const tk=()=>(isB()?'aac.tree2_':'aac.tree_')+settings.level;

let tree = ld(tk(), null) || getTreeForLevel();
let use = ld('aac.use', {});
let path = [], last = '', cn = null, stage = 0, mod = '', tmr = null, sel = '';

const flat=()=>{const r=[];const w=(l,top,ch)=>l.forEach(n=>{const tp=top||n,c2=[...ch,n];r.push({n,top:tp,chain:c2});if(n.c)w(n.c,tp,c2)});w(tree,null,[]);return r};
const score=id=>{const x=use[id];return x?x.n*Math.pow(.9,(Date.now()-x.t)/864e5):0};
const bump=id=>{use[id]={n:score(id)+1,t:Date.now()};try{localStorage.setItem('aac.use',JSON.stringify(use))}catch(e){}};

// Фраза, собранная по цепочке плиток (без плитки-темы): «ru|uk»
const phr=ch=>{const a=ch.slice(1).map(n=>String(n.s||'').split('|'));return a.map(x=>x[0]).join(' ')+'|'+a.map(x=>x[1]||x[0]).join(' ')};
const synth=ch=>{const n=ch[ch.length-1],p=phr(ch);return {id:n.id,l:p,s:p,e:n.e}};

/* ---------- Синтез речи (SpeechSynthesis) ---------- */
function getVoices(){
  if(!('speechSynthesis' in window)) return [];
  return speechSynthesis.getVoices();
}

function speak(txt){
  if(!('speechSynthesis' in window))return;
  speechSynthesis.cancel();
  const m = new SpeechSynthesisUtterance(txt);
  m.lang = lang === 'uk' ? 'uk-UA' : 'ru-RU';
  m.rate = parseFloat(settings.rate) || 0.85;
  m.pitch = parseFloat(settings.pitch) || 1.0;

  const voices = getVoices();
  if(settings.voiceURI){
    const v = voices.find(x => x.voiceURI === settings.voiceURI);
    if(v) m.voice = v;
  } else {
    const code = lang === 'uk' ? 'uk' : 'ru';
    const v = voices.find(x => x.lang.toLowerCase().startsWith(code));
    if(v) m.voice = v;
  }
  speechSynthesis.speak(m);
}

function tile(n,top,fn){
  const b=h('button','tile',null,fn);b.style.setProperty('--c',top.col||'#1E3A8A');
  if(n.img){const i=h('img');i.src=n.img;i.alt='';b.append(i)}else b.append(h('span','em',n.e||'💬'));
  b.append(h('span',null,t(n.l)));return b;
}

function render(){
  const B=isB();
  const m=$('#main'),c=path.length?path[path.length-1]:null;m.innerHTML='';m.scrollTop=0;
  $('#ttl').textContent=!c?u('title'):(B?t(path[0].l):path.map(n=>t(n.l)).join(' › '));

  if(c&&B){
    if(path.length>1){
      const more=c.c&&c.c.length;
      const bx=h('div','build');
      bx.append(h('div','bl',u('built')),h('div','bt',t(phr(path))+(more?' …':'')));
      m.append(bx,h('button','say','🔊 '+u('sayso'),()=>ask(synth(path))));
      if(more)m.append(h('div','sec',u('cont')));
    }
  }else if(c){
    m.append(h('button','say','🔊 '+t(c.s),()=>ask(c)));
  }else if(settings.level !== 'L1'){
    const fr=flat().filter(x=>(B?x.chain.length>1:!x.n.c)&&score(x.n.id)>=1).sort((a,b)=>score(b.n.id)-score(a.n.id)).slice(0,4);
    if(fr.length){
      m.append(h('div','sec',u('freq')));const g=h('div','grid');
      fr.forEach(x=>g.append(B?tile({l:phr(x.chain),e:x.n.e},x.top,()=>ask(synth(x.chain))):tile(x.n,x.top,()=>ask(x.n))));
      m.append(g,h('div','sec',' '));
    }
    if(B)m.append(h('div','sec',u('pick')));
  }

  const g=h('div','grid');
  (c?c.c:tree).forEach(n=>g.append(tile(n,path[0]||n,()=>{
    if(n.c&&n.c.length){path.push(n);render()}
    else ask(B&&path.length?synth([...path,n]):n);
  })));
  m.append(g);
}

  ov.append(r,a);
  ov._crit=top&&top.top.crit;
}
function answer(yes){
  if(!cn)return;
  if(!yes){closeOv();return}
  if(ov._crit&&!stage){stage=1;showAsk();return}
  const txt=t(cn.s)+(mod?' '+mod:'');bump(cn.id);say(txt);
}
function say(txt,silent){
  last=txt;if(!silent)speak(txt);cn=null;
  ov.innerHTML='';ov.className='';ov.style.display='flex';clearInterval(tmr);
  const r=h('div','row');

  ov.append(h('div','big',txt),r);
}
function helpMe(){
  clearInterval(tmr);ov.innerHTML='';ov.className='red';ov.style.display='flex';cn=null;
  const go=()=>speak(u('helpSay'));go();tmr=setInterval(go,6000);
  ov.append(h('div','big','🆘'),h('div','big',u('helpTxt')),h('button','ans neu',u('cancel'),()=>{closeOv();render()}));
}

/* ---------- Нижняя панель ---------- */
[['yes','✔','yes'],['no','✖','no'],['back','↩','back'],['rep','🔊','rep'],['help','🆘','help'],['pain','🤕','pain']].forEach(([k,ic])=>{
  const b=h('button',k==='yes'?'yes':k==='no'?'no':k==='help'?'hp':'',null);b.dataset.k=k;
  b.append(h('span','i',ic),h('span',null,''));
  b.onclick=()=>bar(k);$('#bar').append(b);
});
function labels(){document.querySelectorAll('#bar button').forEach(b=>b.lastChild.textContent=u(b.dataset.k))}
function bar(k){
  if(k==='yes'||k==='no'){
    if(cn){answer(k==='yes');return}
    const w=u(k);say(w);return;
  }
  if(k==='back'){
    if(tmr){closeOv();render();return}
    if(ov.style.display==='flex'){closeOv();return}
    path.pop();render();return;
  }
  if(k==='rep'){if(last){speak(last);if(ov.style.display!=='flex')say(last,true)}return}
  if(k==='help'){helpMe();return}
  if(k==='pain'){closeOv();path=[tree.find(n=>n.id==='pain'||n.id==='pain_1')||tree[0]];render()}
}

$('#home').onclick=()=>{closeOv();path=[];render()};
$('#lang').onclick=()=>{
  lang=lang==='ru'?'uk':'ru';
  localStorage.setItem('aac.lang',lang);
  $('#lang').textContent=lang.toUpperCase();
  document.documentElement.lang=lang;
  labels();applyI18n();closeOv();populateVoices();render();
};

/* ---------- Модальное окно НАСТРОЕК ---------- */
const settModal = $('#sett');
const showLvNote=()=>{$('#lvNote').textContent=(U[lang].lv||{})[$('#setSeg').value]||''};
$('#setSeg').onchange=showLvNote;
$('#settingsBtn').onclick = () => {
  settModal.style.display = 'block';
  $('#setTheme').value = settings.theme;
  $('#setSeg').value = settings.level;
  $('#setGender').value = settings.gender;
  $('#setRate').value = settings.rate;
  $('#rateVal').textContent = settings.rate;
  $('#setPitch').value = settings.pitch;
  $('#pitchVal').textContent = settings.pitch;
  $('#ver').textContent = u('ver') + ': ' + APP_VERSION;
  showLvNote();
  populateVoices();
};

function populateVoices(){
  const select = $('#setVoice');
  select.innerHTML = '';
  const voices = getVoices();
  voices.forEach(v => {
    const opt = new Option(`${v.name} (${v.lang})`, v.voiceURI);
    if(v.voiceURI === settings.voiceURI) opt.selected = true;
    select.append(opt);
  });
}

$('#setRate').oninput = (e) => { $('#rateVal').textContent = e.target.value; };
$('#setPitch').oninput = (e) => { $('#pitchVal').textContent = e.target.value; };

$('#testVoiceBtn').onclick = () => {
  settings.rate = $('#setRate').value;
  settings.pitch = $('#setPitch').value;
  settings.voiceURI = $('#setVoice').value;
  speak(u('testSay'));
};

$('#closeSettBtn').onclick = () => {
  const oldLevel = settings.level;
  settings.theme = $('#setTheme').value;
  settings.level = $('#setSeg').value;
  settings.gender = $('#setGender').value;
  settings.rate = $('#setRate').value;
  settings.pitch = $('#setPitch').value;
  settings.voiceURI = $('#setVoice').value;

  localStorage.setItem('aac.settings', JSON.stringify(settings));
  applyTheme();

  if(oldLevel !== settings.level){
    tree = ld(tk(), null) || getTreeForLevel();
    path = [];sel = '';
  }

  settModal.style.display = 'none';
  render();
};

/* ---------- Модальное окно РЕДАКТОРА ---------- */
const ed=$('#ed');
$('#gear').onclick = () => openEd();
const find=id=>{let r=null;const w=(l)=>l.forEach(n=>{if(n.id===id)r={n,l};if(n.c)w(n.c)});w(tree);return r};
function openEd(){ed.style.display='block';drawEd()}
function drawEd(){
  ed.innerHTML='';
  ed.append(h('h2',null,u('e_title')),h('p','note',isB()?u('e_noteB'):u('e_note')));
  const s=h('select');s.append(new Option(u('e_main'),''));
  const w=(l,d)=>l.forEach(n=>{s.append(new Option('· '.repeat(d)+t(n.l)+' '+(n.e||''),n.id));if(n.c)w(n.c,d+1)});w(tree,0);
  s.value=sel;s.onchange=()=>{sel=s.value;drawEd()};ed.append(h('label',null,u('e_tile')),s);
  const f=sel&&find(sel);
  const fld=(lb,val)=>{const i=h('input');i.type='text';i.value=val;ed.append(h('label',null,lb),i);return i};
  let ir,iu,sr,su,ie;
  if(f){
    const n=f.n,[lr,lu]=(n.l||'').split('|'),[a,b]=(n.s||'').split('|');
    ir=fld(u('e_nl'),lr||'');iu=fld(u('e_nu'),lu||'');
    sr=fld(u('e_pl'),a||'');su=fld(u('e_pu'),b||'');ie=fld(u('e_em'),n.e||'');
  }
  const r=h('div','row');
  if(f){
    r.append(h('button',null,u('e_save'),()=>{const n=f.n;n.l=ir.value+'|'+iu.value;n.s=sr.value+'|'+su.value;n.e=ie.value;save();drawEd()}));
    r.append(h('button','d',u('e_del'),()=>{if(confirm(u('e_cdel'))){f.l.splice(f.l.indexOf(f.n),1);sel='';save();drawEd()}}));
  }
  r.append(h('button',null,u('e_add'),()=>{
    const n={id:'n'+Date.now(),l:'Новая|Нова',s:(isB()?'слово|слово':'Я хочу|Я хочу'),e:'💬'};
    if(f){(f.n.c=f.n.c||[]).push(n)}else{n.col='#1E3A8A';tree.push(n)}
    sel=n.id;save();drawEd()}));
  ed.append(r);
  const r2=h('div','row');
  r2.append(h('button','d',u('e_reset'),()=>{
    if(confirm(u('e_creset'))){
      try{localStorage.removeItem(tk())}catch(e){}
      tree=getTreeForLevel();sel='';drawEd();
    }}));
  ed.append(r2);
  const r3=h('div','row');
  r3.append(h('button',null,u('e_close'),()=>{ed.style.display='none';path=[];closeOv();render()}));
  ed.append(r3);
}

/* ---------- Подписи интерфейса на выбранном языке ---------- */
function fill(sel,opts,val){const el=$(sel);el.innerHTML='';opts.forEach(([v,txt])=>el.append(new Option(txt,v)));el.value=val}
function applyI18n(){
  document.querySelectorAll('[data-i]').forEach(e=>e.textContent=u(e.dataset.i));
  [['#home','aHome'],['#lang','aLang'],['#settingsBtn','aSet'],['#gear','aEd']].forEach(([q,k])=>$(q).setAttribute('aria-label',u(k)));
  document.title=u('title');
  fill('#setSeg',Object.entries(u('lvl')),settings.level);
  fill('#setGender',[['f',u('g_f')],['m',u('g_m')]],settings.gender);
  fill('#setTheme',[['dark',u('th_dark')],['light',u('th_light')]],settings.theme);
  showLvNote();
}

/* ---------- Запуск приложения ---------- */
$('#lang').textContent=lang.toUpperCase();
document.documentElement.lang=lang;
labels();
applyI18n();
render();

if('speechSynthesis' in window){
  speechSynthesis.onvoiceschanged = () => populateVoices();
}

/* ---------- Офлайн-режим и автообновление ---------- */
if('serviceWorker' in navigator){
  const hadController = !!navigator.serviceWorker.controller;
  let reloaded = false;
  // Когда новая версия взяла управление — один раз перезагружаем страницу, чтобы показать её
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(!hadController||reloaded)return;
    reloaded=true;location.reload();
  });
  addEventListener('load',()=>{
    navigator.serviceWorker.register('/Govorim/sw.js',{scope:'/Govorim/',updateViaCache:'none'})
      .then(reg=>{
        reg.update().catch(()=>{});
        document.addEventListener('visibilitychange',()=>{if(!document.hidden)reg.update().catch(()=>{})});
      }).catch(()=>{});
  });
}
</script>
