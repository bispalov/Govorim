<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#16384F">
<link rel="manifest" href="/govorim/manifest.json">
<link rel="icon" href="/govorim/icon-192.png">
<title>Говорим вместе</title>
<style>
:root{color-scheme:light;--ink:#14202B;--bg:#EEF2F5;--navy:#16384F;--hdr:#16384F;--surf:#fff;--surf2:#E3E9EE;--line:#16384F;--bm:100%;--tint:12%}
:root[data-theme=dark]{color-scheme:dark;--ink:#EAF0F5;--bg:#0F161C;--navy:#2C6A99;--hdr:#0B2A3F;--surf:#1A242D;--surf2:#27333E;--line:#7FA6C4;--bm:70%;--tint:24%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;max-width:100%}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:600 18px/1.2 system-ui,Roboto,sans-serif;overflow-x:hidden}
body{display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
:focus-visible{outline:4px solid #F2B705;outline-offset:2px}
header{display:flex;gap:6px;align-items:center;padding:8px;background:var(--hdr);color:#fff;width:100%}
header h1{flex:1;margin:0;font-size:20px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.hb{min-width:48px;min-height:48px;border-radius:12px;background:#ffffff26;color:#fff;font-size:22px}
#stage{flex:1;position:relative;min-height:0;width:100%}
main{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:8px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;width:100%}
@media(min-width:480px){.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}}
.sec{margin:4px 2px 6px;font-size:16px;opacity:.75}
.tile{min-height:120px;border-radius:16px;border:3px solid color-mix(in srgb,var(--c) var(--bm),#fff);background:color-mix(in srgb,var(--c) var(--tint),var(--surf));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px;font-size:20px;font-weight:700;text-align:center;overflow-wrap:anywhere;word-break:break-word}
.tile .em{font-size:48px;line-height:1}
.tile img,.big img{width:72px;height:72px;object-fit:cover;border-radius:10px}
.say{width:100%;min-height:64px;margin-bottom:8px;border-radius:14px;background:var(--navy);color:#fff;font-size:20px;padding:8px}
#ov{position:absolute;inset:0;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:12px;text-align:center;overflow-y:auto}
#ov.red{background:#B3261E;color:#fff}
.big{font-size:28px;font-weight:800;line-height:1.15;overflow-wrap:anywhere}
.big .em{font-size:80px;display:block}
.big img{width:130px;height:130px}
.row{display:flex;gap:8px;width:100%;flex-wrap:wrap;justify-content:center}
.chip{min-height:48px;padding:0 14px;border-radius:24px;background:var(--surf);border:2px solid var(--line);font-size:18px}
.chip.on{background:var(--navy);color:#fff}
.ans{flex:1;min-height:100px;border-radius:16px;font-size:28px;color:#fff;font-weight:800}
.yes{background:#1F7A4D}.no{background:#B3261E}.neu{background:var(--navy)}
#bar{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;padding:4px;background:var(--surf);border-top:2px solid var(--line);width:100%}
#bar button{min-height:60px;border-radius:10px;font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:var(--surf2);font-weight:700;padding:2px}
#bar .i{font-size:22px}
#bar .yes,#bar .no{color:#fff}
#bar .hp{background:#B3261E;color:#fff}
#ed{position:fixed;inset:0;background:var(--surf);color:var(--ink);display:none;overflow-y:auto;padding:12px;z-index:10;font-size:16px;font-weight:500}
#ed label{display:block;margin:8px 0 2px;font-weight:700}
#ed input[type=text],#ed select{width:100%;font:inherit;padding:8px;border:2px solid #789;border-radius:8px;background:var(--bg);color:var(--ink)}
#set{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:8px;z-index:20}
.dlg{background:var(--surf);color:var(--ink);width:100%;max-width:480px;max-height:92vh;overflow-y:auto;border-radius:16px;padding:12px;font-weight:600}
.dlg h2{margin:0 0 4px;font-size:22px}
.dlg label{display:flex;justify-content:space-between;margin:10px 0 2px;font-size:16px}
.dlg select{width:100%;font:inherit;font-size:16px;padding:8px;border:2px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.dlg input[type=range]{width:100%;height:32px;accent-color:var(--navy)}
.dlg .note{font-size:14px;opacity:.75;font-weight:500;margin:4px 0}
.sb{width:100%;min-height:48px;margin-top:10px;border-radius:10px;background:var(--navy);color:#fff;font-size:16px}
.sb.alt{background:var(--surf2);color:var(--ink)}
.sb.ok{background:#1F7A4D}
.dlg h3{margin:12px 0 0;font-size:18px}
.dlg input[type=text]{width:100%;font:inherit;font-size:16px;padding:8px;border:2px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.scan{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center}
.scan .ans{width:100%;flex:none}.scan .row{flex-wrap:nowrap}
.pbar{position:sticky;top:-8px;z-index:2;background:var(--bg);margin:-8px -8px 6px;padding:8px}
.ptxt{min-height:2.4em;font-size:26px;font-weight:800;line-height:1.15;border:2px dashed var(--line);border-radius:12px;padding:8px;margin-bottom:6px;overflow-wrap:anywhere}
.pbar .row{margin:0;flex-wrap:nowrap}.pbar .sb{width:auto;flex:1;min-width:0;margin:0}
#ed .row{margin:10px 0}
#ed button{min-height:44px;padding:0 12px;border-radius:8px;background:var(--navy);color:#fff}
#ed button.d{background:#B3261E}
#ed .note{opacity:.7;font-size:14px}
</style>
</head>
<body>

  <button class="hb" id="home" aria-label="Домой">🏠</button>

}
function rank(k){

function scanAns(yes){

  if(!yes){f.i++;scanShow();return}
  if(n.c&&n.c.length){sc.push({list:rank(n.c),i:0,ttl:t(n.l)});scanShow();return}
  const tp=flat().find(x=>x.n.id===n.id);
  if(tp&&tp.top.crit)ask(n);else{bump(n.id);say(t(n.s))}
}
function scanBack(){const f=sc[sc.length-1];if(!f)return;if(f.i>0)f.i--;else if(sc.length>1)sc.pop();scanShow()}

const READY='Да|Так;Нет|Ні;Не надо|Не треба;Хорошо|Добре;Спасибо|Дякую;Пожалуйста|Будь ласка;Извините|Вибачте;Подождите|Зачекайте;Повторите, пожалуйста|Повторіть, будь ласка;Говорите медленнее|Говоріть повільніше;Я понимаю|Я розумію;Я не понимаю|Я не розумію;Это не то|Це не те;Не могу вспомнить слово|Не можу згадати слово;Скажите по-другому|Скажіть інакше;Доброе утро|Доброго ранку;Добрый день|Добрий день;Добрый вечер|Добрий вечір;Спокойной ночи|На добраніч;До свидания|До побачення;Как дела?|Як справи?;У меня всё хорошо|У мене все добре;Помогите|Допоможіть';
const L2=x=>x.split(';').map(y=>t(y));
function bReset(){ph=[];hist=[];bs=0;bf=null}
const ptxt=()=>{const x=ph.join(' ');return x.charAt(0).toUpperCase()+x.slice(1)+(bf&&bf.q&&bs>=2?'?':'')};
function bPush(txt,nbs,nbf){hist.push({bs,bf});ph.push(txt);bs=nbs;bf=nbf;if(set.auto!==false)speak(ptxt());buildShow()}
function bUndo(){if(bs===3){bs=0;buildShow();return}if(!ph.length)return;const p=hist.pop();ph.pop();bs=p.bs;bf=p.bf;buildShow()}
function bClear(){bReset();buildShow()}
function opts(f){
  let a=L2(LS[f.k]);
  if(f.id==='where'||f.id==='when'){const nm=(set.people||'').split(',').map(x=>x.trim()).filter(Boolean);a=a.concat(nm.map(x=>f.id==='when'?(lang==='uk'?'прийде ':'придёт ')+x:x))}
  return a;
}
function buildShow(){
  const m=$('#main');m.innerHTML='';m.scrollTop=0;$('#ttl').textContent=u('title');
  const pb=h('div','pbar');pb.append(h('div','ptxt',ph.length?ptxt():'…'));
  const r=h('div','row');r.append(h('button','sb','🔊',()=>speak(ptxt())),h('button','sb','⌫',bUndo),h('button','sb ok','✔ '+u('ok'),bClear));
  pb.append(r);m.append(pb);
  const g=h('div','grid'),ct=(txt,col,fn,e)=>{const b=h('button','tile',null,fn);b.style.setProperty('--c',col);if(e)b.append(h('span','em',e));b.append(h('span',null,txt));return b};
  if(bs===0){
    FR.forEach(f=>g.append(ct(t(f.l),'#16384F',()=>bPush(t(f.l),1,f),f.e)));
    g.append(ct(q('Готовые фразы','Готові фрази'),'#2F855A',()=>{bs=3;buildShow()},'💬'));
    g.append(ct(q('Темы','Теми'),'#8A6D00',()=>{view='tree';path=[];render()},'📚'));
  }else if(bs===1)opts(bf).forEach(o=>g.append(ct(o,'#2B6CB0',()=>bPush(o,2,bf))));
  else if(bs===3)L2(READY).forEach(o=>g.append(ct(o,'#2F855A',()=>bPush(o,2,null))));
  else{L2(MODS).forEach(o=>g.append(ct(o,'#6B46C1',()=>bPush(o,2,bf))));g.append(ct(q('Новая фраза','Нова фраза'),'#16384F',bClear,'➕'))}
  m.append(g);
}
let dip=null;addEventListener('beforeinstallprompt',e=>{e.preventDefault();dip=e});

/* ---------- настройки (модальное окно) ---------- */
const sm=$('#set'),q=(a,b)=>lang==='uk'?b:a;
const saveSet=()=>{try{localStorage.setItem(K('set'),JSON.stringify(set))}catch(e){}};
const test=()=>speak(q('Я хочу чай','Я хочу чай'));
function applyTheme(){
  const d=set.theme==='dark'||(set.theme==='auto'&&matchMedia('(prefers-color-scheme:dark)').matches);
  document.documentElement.dataset.theme=d?'dark':'light';
  document.querySelector('meta[name=theme-color]').content=d?'#0B2A3F':'#16384F';
}
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',applyTheme);
function openSet(){sm.style.display='flex';drawSet()}
function closeSet(){sm.style.display='none';sm.innerHTML='';render()}
function drawSet(){
  sm.innerHTML='';sm.onclick=e=>{if(e.target===sm)closeSet()};
  const d=h('div','dlg');d.append(h('h2',null,q('Настройки','Налаштування')));
  const lab=(txt,val)=>{const l=h('label');l.append(h('span',null,txt));const v=h('span',null,val==null?'':val);l.append(v);d.append(l);return v};
  lab(q('Уровень речи','Рівень мовлення'));
  const lr=h('div','row');
  [[1,q('Тяжёлый','Тяжкий')],[2,q('Средний','Середній')],[3,q('Лёгкий','Легкий')]].forEach(([k,n])=>lr.append(h('button','chip'+(set.level===k?' on':''),n,()=>{set.level=k;saveSet();closeOv();path=[];sc=[];bReset();view=VIEW();drawSet()})));
  d.append(lr,h('p','note',[q('Варианты по одному: отвечать «Да» или «Нет».','Варіанти по одному: відповідати «Так» чи «Ні».'),q('Плитки с картинками, 2–3 шага, подтверждение.','Плитки з картинками, 2–3 кроки, підтвердження.'),q('Фраза собирается из слов по шагам и звучит по ходу; больше тем.','Фраза складається зі слів по кроках і звучить по ходу; більше тем.')][set.level-1]));
  lab(q('Голос','Голос'));
  const vs=voices().filter(vlang),sv=h('select');
  if(!vs.length)sv.append(new Option(q('Голос не найден','Голос не знайдено'),''));
  vs.forEach(x=>sv.append(new Option(x.name+' ('+x.lang+')',x.name)));
  const cv=pickVoice();if(cv)sv.value=cv.name;
  sv.onchange=()=>{set.voice[lang]=sv.value;saveSet();test()};d.append(sv);
  if(!vs.length)d.append(h('p','note',q('Установите голос: Настройки Android → Язык → Синтез речи.','Встановіть голос: Налаштування Android → Мова → Синтез мовлення.')));
  const sl=(txt,key,min,max,step)=>{const v=lab(txt,set[key]),i=h('input');i.type='range';i.min=min;i.max=max;i.step=step;i.value=set[key];
    i.oninput=()=>{set[key]=+i.value;v.textContent=i.value;saveSet()};i.onchange=test;d.append(i)};
  sl(q('Скорость','Швидкість'),'rate',.5,1.5,.05);sl(q('Высота голоса','Висота голосу'),'pitch',.5,1.5,.05);sl(q('Громкость','Гучність'),'vol',.2,1,.1);
  d.append(h('button','sb','▶ '+q('Проверить звук','Перевірити звук'),test));
  lab(q('Озвучивать при нажатии','Озвучувати при натисканні'));
  const st=h('select');
  [['label',q('Название плитки','Назва плитки')],['phrase',q('Полную фразу','Повну фразу')],['off',q('Не озвучивать','Не озвучувати')]].forEach(([k,n])=>st.append(new Option(n,k)));
  st.value=set.tap;st.onchange=()=>{set.tap=st.value;saveSet()};d.append(st);
  lab(q('Тема','Тема'));
  const r=h('div','row');
  [['auto',q('Как в системе','Як у системі')],['light',q('Светлая','Світла')],['dark',q('Тёмная','Темна')]].forEach(([k,n])=>
    r.append(h('button','chip'+(set.theme===k?' on':''),n,()=>{set.theme=k;saveSet();applyTheme();drawSet()})));
  d.append(r);
  if(set.level===3){
    lab(q('Озвучивать фразу по ходу сборки','Озвучувати фразу по ходу складання'));
    const sa=h('select');sa.append(new Option(q('Да','Так'),'1'),new Option(q('Нет','Ні'),'0'));sa.value=set.auto===false?'0':'1';sa.onchange=()=>{set.auto=sa.value==='1';saveSet()};d.append(sa);
    lab(q('Имена близких (через запятую)','Імена близьких (через кому)'));
    const pi=h('input');pi.type='text';pi.value=set.people||'';pi.onchange=()=>{set.people=pi.value;saveSet()};d.append(pi);
  }
  d.append(h('h3',null,q('Установка','Встановлення')));
  const st2=matchMedia('(display-mode: standalone)').matches;
  d.append(h('p','note',q('Режим: ','Режим: ')+(st2?q('приложение','застосунок'):q('вкладка браузера','вкладка браузера'))+' · '+q('Офлайн: ','Офлайн: ')+(navigator.serviceWorker&&navigator.serviceWorker.controller?q('готово','готово'):q('ещё нет, откройте ещё раз','ще ні, відкрийте ще раз'))+' · '+q('Адрес: ','Адреса: ')+new URL('/govorim/',location.href).pathname));
  if(dip)d.append(h('button','sb','⬇ '+q('Установить приложение','Встановити застосунок'),async()=>{dip.prompt();try{await dip.userChoice}catch(e){}dip=null;drawSet()}));
  else if(!st2)d.append(h('p','note',q('Нет кнопки установки? Меню Chrome ⋮ → «Установить приложение». Если там «Открыть в приложении», на этом домене уже установлено другое приложение, чей охват (scope) включает этот адрес: удалите его или сузьте его scope.','Немає кнопки встановлення? Меню Chrome ⋮ → «Встановити застосунок». Якщо там «Відкрити в застосунку», на цьому домені вже встановлено інший застосунок, чий охоплення (scope) містить цю адресу: видаліть його або звузьте його scope.')));
  const eb=h('button','sb alt','✏️ '+q('Редактор плиток (удерживать)','Редактор плиток (утримувати)'));
  let hd;eb.onpointerdown=()=>{hd=setTimeout(()=>{closeSet();openEd()},1500)};
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>eb.addEventListener(ev,()=>clearTimeout(hd)));
  d.append(eb,h('p','note',q('Редактор для родственника: держите кнопку 1,5 секунды.','Редактор для родичів: утримуйте кнопку 1,5 секунди.')),h('button','sb',q('Закрыть','Закрити'),closeSet));
  sm.append(d);
}
if('speechSynthesis' in window)speechSynthesis.onvoiceschanged=()=>{if(sm.style.display==='flex')drawSet()};

/* ---------- запуск ---------- */
applyTheme();
$('#lang').textContent=lang.toUpperCase();document.documentElement.lang=lang;labels();view=VIEW();render();
if('speechSynthesis' in window)speechSynthesis.getVoices();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('/govorim/sw.js',{scope:'/govorim/'}).catch(()=>{}));
</script>
