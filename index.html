<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12181F">
<link rel="manifest" href="/Govorim/manifest.json">
<link rel="icon" href="/Govorim/icon-192.png">
<title>Говорим вместе</title>
<style>
:root {
  --ink: #EEF2F5;
  --bg: #12181F;
  --card-bg: #1E293B;
  --navy: #1E3A8A;
  --accent: #3B82F6;
  --border: #334155;
}

[data-theme="light"] {
  --ink: #14202B;
  --bg: #EEF2F5;
  --card-bg: #FFFFFF;
  --navy: #16384F;
  --accent: #2563EB;
  --border: #CBD5E1;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:600 20px/1.2 system-ui,Roboto,sans-serif;transition:background 0.2s, color 0.2s}
body{display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
:focus-visible{outline:4px solid #F2B705;outline-offset:2px}

header{display:flex;gap:8px;align-items:center;padding:8px 10px;background:var(--navy);color:#fff}
header h1{flex:1;margin:0;font-size:22px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.hb{min-width:56px;min-height:56px;border-radius:14px;background:#ffffff26;color:#fff;font-size:24px;display:flex;align-items:center;justify-content:center}

#stage{flex:1;position:relative;min-height:0}
main{position:absolute;inset:0;overflow-y:auto;padding:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.sec{margin:8px 2px 4px;font-size:18px;opacity:.8;font-weight:700}

.tile{min-height:130px;border-radius:18px;border:3px solid var(--c);background:color-mix(in srgb, var(--c) 20%, var(--card-bg));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:8px;font-size:22px;font-weight:700;text-align:center;overflow-wrap:anywhere;color:var(--ink)}
.tile .em{font-size:52px;line-height:1}
.tile img,.big img{width:80px;height:80px;object-fit:cover;border-radius:12px}

.say{width:100%;min-height:72px;margin-bottom:10px;border-radius:16px;background:var(--navy);color:#fff;font-size:22px;padding:10px;text-align:left}

#ov{position:absolute;inset:0;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:14px;text-align:center;overflow-y:auto;z-index:5}
#ov.red{background:#B3261E;color:#fff}
.big{font-size:30px;font-weight:800;line-height:1.15;overflow-wrap:anywhere}
.big .em{font-size:80px;display:block}
.big img{width:140px;height:140px}

.row{display:flex;gap:10px;width:100%;flex-wrap:wrap;justify-content:center}
.chip{min-height:52px;padding:0 16px;border-radius:26px;background:var(--card-bg);border:2px solid var(--navy);color:var(--ink);font-size:18px}
.chip.on{background:var(--navy);color:#fff}

.ans{flex:1;min-height:100px;border-radius:20px;font-size:28px;color:#fff;font-weight:800}
.yes{background:#1F7A4D}.no{background:#B3261E}.neu{background:var(--navy)}

#bar{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;padding:6px;background:var(--card-bg);border-top:2px solid var(--border)}
#bar button{min-height:68px;border-radius:12px;font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:color-mix(in srgb, var(--navy) 15%, var(--card-bg));color:var(--ink);font-weight:700}
#bar .i{font-size:24px}
#bar .yes{background:#1F7A4D;color:#fff}
#bar .no{background:#B3261E;color:#fff}
#bar .hp{background:#B3261E;color:#fff}

/* Модальные окна: Редактор и Настройки */
.modal{position:fixed;inset:0;background:var(--bg);color:var(--ink);display:none;overflow-y:auto;padding:16px;z-index:20;font-size:17px;font-weight:500}
.modal h2{margin-top:0;font-size:24px}
.modal label{display:block;margin:12px 0 4px;font-weight:700}
.modal input[type=text],.modal input[type=range],.modal select{width:100%;font:inherit;padding:10px;border:2px solid var(--border);border-radius:10px;background:var(--card-bg);color:var(--ink)}
.modal .row{margin:14px 0}
.modal button{min-height:50px;padding:0 16px;border-radius:12px;background:var(--navy);color:#fff;font-weight:700}
.modal button.d{background:#B3261E}
.modal .note{opacity:.75;font-size:15px}
.range-val{float:right;font-weight:normal;opacity:0.8}
</style>
</head>
<body>
<header>
  <button class="hb" id="home" aria-label="Домой">🏠</button>
  <h1 id="ttl"></h1>
  <button class="hb" id="lang" aria-label="Язык">RU</button>
  <button class="hb" id="settingsBtn" aria-label="Настройки">⚙️</button>
  <button class="hb" id="gear" aria-label="Редактор">✏️</button>
</header>

<div id="stage">
  <main id="main"></main>
  <div id="ov"></div>
</div>

<nav id="bar"></nav>

<!-- Модальное окно Редактора -->
<div id="ed" class="modal"></div>

<!-- Модальное окно Настроек -->
<div id="sett" class="modal">
  <h2>⚙️ Настройки / Налаштування</h2>
  
  <label>Уровень сложности / Рівень складності:</label>
  <select id="setSeg">
    <option value="L1">Тяжелый (Простые слова / Базові потреби)</option>
    <option value="L2">Средний (Категории / Категорії)</option>
    <option value="L3">Легкий (Фразовый конструктор / Фрази)</option>
  </select>

  <label>Тема оформления / Тема оформления:</label>
  <select id="setTheme">
    <option value="dark">Тёмная / Темна 🌙</option>
    <option value="light">Светлая / Світла ☀️</option>
  </select>

  <label>Голос озвучки / Голос озвучення:</label>
  <select id="setVoice"></select>

  <label>Скорость речи / Швидкість мовлення: <span id="rateVal" class="range-val">0.85</span></label>
  <input type="range" id="setRate" min="0.4" max="1.3" step="0.05" value="0.85">

  <label>Высота тона / Висота тону: <span id="pitchVal" class="range-val">1.0</span></label>
  <input type="range" id="setPitch" min="0.5" max="1.5" step="0.1" value="1.0">

  <div class="row">
    <button id="testVoiceBtn">🔊 Проверить голос / Перевірити</button>
  </div>

  <div class="row" style="margin-top:24px">
    <button id="closeSettBtn" style="width:100%">Закрыть / Закрити</button>
  </div>
</div>

<script>
const $=s=>document.querySelector(s);
const h=(tag,cls,txt,fn)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;if(fn)e.onclick=fn;return e};

/* ---------- Интерноционализация ---------- */
const U={
ru:{title:'Говорим вместе',freq:'Часто',yes:'Да',no:'Нет',back:'Назад',rep:'Повтор',help:'Помощь',pain:'Больно',sure:'Точно?',done:'Готово',cancel:'Отмена',mods:['сейчас','потом','ещё','хватит'],helpSay:'Помогите! Мне нужна помощь!',helpTxt:'МНЕ НУЖНА ПОМОЩЬ'},
uk:{title:'Говоримо разом',freq:'Часто',yes:'Так',no:'Ні',back:'Назад',rep:'Повтор',help:'Допомога',pain:'Болить',sure:'Точно?',done:'Готово',cancel:'Скасувати',mods:['зараз','потім','ще','досить'],helpSay:'Допоможіть! Мені потрібна допомога!',helpTxt:'МЕНІ ПОТРІБНА ДОПОМОГА'}};
let lang=localStorage.getItem('aac.lang')||'ru';
const u=k=>U[lang][k];
const t=s=>{const p=String(s||'').split('|');return lang==='uk'&&p[1]?p[1]:p[0]};

/* ---------- Настройки (с поддержкой темы по умолчанию) ---------- */
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
let settings = ld('aac.settings', {
  theme: 'dark',
  level: 'L2',
  rate: 0.85,
  pitch: 1.0,
  voiceURI: ''
});

function applyTheme(){
  document.documentElement.setAttribute('data-theme', settings.theme);
  const themeMeta = $('meta[name="theme-color"]');
  if(themeMeta) themeMeta.setAttribute('content', settings.theme === 'dark' ? '#12181F' : '#16384F');
}
applyTheme();

/* ---------- Словари под разные уровни нарушения речи ---------- */
const L=(l,s,e)=>({id:'d'+Math.random().toString(36).slice(2,8),l,s,e});

// L1: Тяжелая степень - пиктограммы прямого действия
const DEF_L1 = () => [
  {id:'drink_1',col:'#2B6CB0',l:'Вода|Вода',s:'Я хочу пить|Я хочу пити',e:'💧'},
  {id:'eat_1',col:'#C27C0E',l:'Еда|Їжа',s:'Я хочу есть|Я хочу їсти',e:'🍽️'},
  {id:'wc_1',col:'#0F8B8D',l:'Туалет|Туалет',s:'Мне нужно в туалет|Мені потрібно в туалет',e:'🚽'},
  {id:'pain_1',col:'#B3261E',l:'Больно|Болить',s:'Мне больно|Мені боляче',e:'🤕'},
  {id:'bed_1',col:'#8A6D00',l:'Лячь|Лягти',s:'Я хочу лечь|Я хочу лягти',e:'🛏️'},
  {id:'cold_1',col:'#B83280',l:'Холодно|Холодно',s:'Мне холодно|Мені холодно',e:'🥶'},
  {id:'hot_1',col:'#C27C0E',l:'Жарко|Жарко',s:'Мне жарко|Мені гаряче',e:'🥵'},
  {id:'bad_1',col:'#6B46C1',l:'Плохо|Погано',s:'Мне плохо|Мені погано',e:'🤢'}
];

// L2: Средняя степень - категориальная структура
const DEF_L2 = () => [
{id:'drink',col:'#2B6CB0',l:'Пить|Пити',s:'Я хочу пить|Я хочу пити',e:'🥤',c:[
 L('Вода|Вода','Я хочу воды|Я хочу води','💧'),L('Чай|Чай','Я хочу чай|Я хочу чай','🍵'),L('Кофе|Кава','Я хочу кофе|Я хочу каву','☕'),
 L('Сок|Сік','Я хочу сок|Я хочу сік','🧃'),L('Молоко|Молоко','Я хочу молоко|Я хочу молоко','🥛')]},
{id:'eat',col:'#C27C0E',l:'Есть|Їсти',s:'Я хочу есть|Я хочу їсти',e:'🍽️',c:[
 L('Суп|Суп','Я хочу суп|Я хочу суп','🍲'),L('Каша|Каша','Я хочу кашу|Я хочу кашу','🥣'),L('Хлеб|Хліб','Я хочу хлеб|Я хочу хліб','🍞'),
 L('Мясо|М\'ясо','Я хочу мясо|Я хочу м\'ясо','🍗'),L('Фрукты|Фрукти','Я хочу фрукты|Я хочу фрукти','🍎')]},
{id:'wc',col:'#0F8B8D',l:'Туалет|Туалет',s:'Мне нужно в туалет|Мені потрібно в туалет',e:'🚻',c:[
 L('Туалет|Туалет','Мне нужно в туалет|Мені потрібно в туалет','🚽'),L('Умыться|Вмитися','Я хочу умыться|Я хочу вмитися','🚿'),
 L('Душ|Душ','Я хочу в душ|Я хочу в душ','🛁')]},
{id:'pain',col:'#B3261E',crit:1,l:'Болит|Болить',s:'У меня что-то болит|У мене щось болить',e:'🤕',c:[
 L('Голова|Голова','У меня болит голова|У мене болить голова','🧠'),L('Сердце|Серце','У меня болит сердце|У мене болить серце','❤️'),
 L('Живот|Живіт','У меня болит живот|У мене болить живіт','🤢'),L('Спина|Спина','У меня болит спина|У мене болить спина','🧍')]},
{id:'ppl',col:'#2F855A',l:'Люди|Люди',s:'Я хочу поговорить|Я хочу поговорити',e:'👥',c:[
 L('Позвонить|Подзвонити','Я хочу позвонить|Я хочу подзвонити','📱'),L('Врач|Лікар','Мне нужен врач|Мені потрібен лікар','👩‍⚕️'),
 L('Тишина|Тиша','Я хочу побыть в тишине|Я хочу побути в тиші','🤫')]}
];

// L3: Легкая степень - последовательный конструктор сообщений
const DEF_L3 = () => [
{id:'subj',col:'#2B6CB0',l:'Кто? | Хто?',s:'Я|Я',e:'👤',c:[
 L('Я|Я','Я|Я','🙋'),L('Мне|Мені','Мне|Мені','👈'),L('Нам|Нам','Нам|Нам','👥')]},
{id:'action',col:'#C27C0E',l:'Действие | Дія',s:'хочу|хочу',e:'⚡',c:[
 L('Хочу|Хочу','хочу|хочу','💭'),L('Нужно|Потрібно','нужно|потрібно','❗'),L('Чувствую|Почуваю','чувствую|почуваю','❤️')]},
{id:'obj',col:'#0F8B8D',l:'Что? | Що?',s:'помощь|допомогу',e:'📦',c:[
 L('Отдохнуть|Відпочити','отдохнуть|відпочити','🛌'),L('Позвонить врачу|Зателефонувати лікарю','позвонить врачу|зателефонувати лікарю','📞'),
 L('Гулять|Гуляти','пойти на прогулку|піти на прогулянку','🚶'),L('Новости|Новини','узнать новости|дізнатися новини','📰')]}
];

function getTreeForLevel(){
  if(settings.level === 'L1') return DEF_L1();
  if(settings.level === 'L3') return DEF_L3();
  return DEF_L2();
}

let tree = ld('aac.tree_' + settings.level, null) || getTreeForLevel();
let use = ld('aac.use', {});
let path = [], last = '', cn = null, stage = 0, mod = '', tmr = null, sel = '';

const save = () => {
  try {
    localStorage.setItem('aac.tree_' + settings.level, JSON.stringify(tree));
  } catch(e){ alert('Не хватает памяти'); }
};

const flat=()=>{const r=[];const w=(l,top)=>l.forEach(n=>{const tp=top||n;r.push({n,top:tp});if(n.c)w(n.c,tp)});w(tree);return r};
const score=id=>{const x=use[id];return x?x.n*Math.pow(.9,(Date.now()-x.t)/864e5):0};
const bump=id=>{use[id]={n:score(id)+1,t:Date.now()};try{localStorage.setItem('aac.use',JSON.stringify(use))}catch(e){}};

/* ---------- Синтез речи (SpeechSynthesis) ---------- */
function getVoices(){
  if(!('speechSynthesis' in window)) return [];
  return speechSynthesis.getVoices();
}

function speak(txt){
  if(!('speechSynthesis' in window))return;
  speechSynthesis.cancel();
  const m = new SpeechSynthesisUtterance(txt);
  m.lang = lang === 'uk' ? 'uk-UA' : 'ru-RU';
  m.rate = parseFloat(settings.rate) || 0.85;
  m.pitch = parseFloat(settings.pitch) || 1.0;

  const voices = getVoices();
  if(settings.voiceURI){
    const v = voices.find(x => x.voiceURI === settings.voiceURI);
    if(v) m.voice = v;
  } else {
    const code = lang === 'uk' ? 'uk' : 'ru';
    const v = voices.find(x => x.lang.toLowerCase().startsWith(code));
    if(v) m.voice = v;
  }
  speechSynthesis.speak(m);
}

/* ---------- Отрисовка интерфейса ---------- */
function tile(n,top,fn){
  const b=h('button','tile',null,fn);b.style.setProperty('--c',top.col||'#1E3A8A');
  if(n.img){const i=h('img');i.src=n.img;i.alt='';b.append(i)}else b.append(h('span','em',n.e||'💬'));
  b.append(h('span',null,t(n.l)));return b;
}

function render(){
  const m=$('#main'),c=path.length?path[path.length-1]:null;m.innerHTML='';m.scrollTop=0;
  $('#ttl').textContent=c?path.map(n=>t(n.l)).join(' › '):u('title');
  if(c){m.append(h('button','say','🔊 '+t(c.s),()=>ask(c)))}
  else if(settings.level !== 'L1'){
    const fr=flat().filter(x=>!x.n.c&&score(x.n.id)>=1).sort((a,b)=>score(b.n.id)-score(a.n.id)).slice(0,4);
    if(fr.length){m.append(h('div','sec',u('freq')));const g=h('div','grid');fr.forEach(x=>g.append(tile(x.n,x.top,()=>ask(x.n))));m.append(g,h('div','sec',' '))}
  }
  const g=h('div','grid');
  (c?c.c:tree).forEach(n=>g.append(tile(n,path[0]||n,()=>{if(n.c&&n.c.length){path.push(n);render()}else ask(n)})));
  m.append(g);
}

/* ---------- Окно подтверждения / Сказано ---------- */
const ov=$('#ov');
function closeOv(){ov.style.display='none';ov.className='';ov.innerHTML='';clearInterval(tmr);tmr=null;cn=null}
function pic(n){const d=h('div','big');if(n.img){const i=h('img');i.src=n.img;i.alt='';d.append(i)}else d.append(h('span','em',n.e||'💬'));return d}
function ask(n){cn=n;stage=0;mod='';showAsk()}
function showAsk(){
  const top=flat().find(x=>x.n.id===cn.id);
  const txt=t(cn.s)+(mod?' '+mod:'');
  ov.innerHTML='';ov.className='';ov.style.display='flex';
  ov.append(pic(cn),h('div','big',(stage?u('sure')+' ':'')+txt+'?'));
  const r=h('div','row');
  u('mods').forEach(w=>{const c=h('button','chip'+(mod===w?' on':''),w,()=>{mod=mod===w?'':w;showAsk()});r.append(c)});
  const a=h('div','row');
  a.append(h('button','ans yes','✔ '+u('yes'),()=>answer(true)),h('button','ans no','✖ '+u('no'),()=>answer(false)));
  ov.append(r,a);
  ov._crit=top&&top.top.crit;
}
function answer(yes){
  if(!cn)return;
  if(!yes){closeOv();return}
  if(ov._crit&&!stage){stage=1;showAsk();return}
  const txt=t(cn.s)+(mod?' '+mod:'');bump(cn.id);say(txt);
}
function say(txt,silent){
  last=txt;if(!silent)speak(txt);cn=null;
  ov.innerHTML='';ov.className='';ov.style.display='flex';clearInterval(tmr);
  const r=h('div','row');
  r.append(h('button','ans neu','🔊 '+u('rep'),()=>speak(last)),h('button','ans yes',u('done'),()=>{closeOv();path=[];render()}));
  ov.append(h('div','big',txt),r);
}
function helpMe(){
  clearInterval(tmr);ov.innerHTML='';ov.className='red';ov.style.display='flex';cn=null;
  const go=()=>speak(u('helpSay'));go();tmr=setInterval(go,6000);
  ov.append(h('div','big','🆘'),h('div','big',u('helpTxt')),h('button','ans neu',u('cancel'),()=>{closeOv();render()}));
}

/* ---------- Нижняя панель ---------- */
[['yes','✔','yes'],['no','✖','no'],['back','↩','back'],['rep','🔊','rep'],['help','🆘','help'],['pain','🤕','pain']].forEach(([k,ic])=>{
  const b=h('button',k==='yes'?'yes':k==='no'?'no':k==='help'?'hp':'',null);b.dataset.k=k;
  b.append(h('span','i',ic),h('span',null,''));
  b.onclick=()=>bar(k);$('#bar').append(b);
});
function labels(){document.querySelectorAll('#bar button').forEach(b=>b.lastChild.textContent=u(b.dataset.k))}
function bar(k){
  if(k==='yes'||k==='no'){
    if(cn){answer(k==='yes');return}
    const w=u(k);say(w);return;
  }
  if(k==='back'){
    if(tmr){closeOv();render();return}
    if(ov.style.display==='flex'){closeOv();return}
    path.pop();render();return;
  }
  if(k==='rep'){if(last){speak(last);if(ov.style.display!=='flex')say(last,true)}return}
  if(k==='help'){helpMe();return}
  if(k==='pain'){closeOv();path=[tree.find(n=>n.id==='pain'||n.id==='pain_1')||tree[0]];render()}
}

$('#home').onclick=()=>{closeOv();path=[];render()};
$('#lang').onclick=()=>{
  lang=lang==='ru'?'uk':'ru';
  localStorage.setItem('aac.lang',lang);
  $('#lang').textContent=lang.toUpperCase();
  document.documentElement.lang=lang;
  labels();closeOv();populateVoices();render();
};

/* ---------- Модальное окно НАСТРОЕК ---------- */
const settModal = $('#sett');
$('#settingsBtn').onclick = () => {
  settModal.style.display = 'block';
  $('#setTheme').value = settings.theme;
  $('#setSeg').value = settings.level;
  $('#setRate').value = settings.rate;
  $('#rateVal').textContent = settings.rate;
  $('#setPitch').value = settings.pitch;
  $('#pitchVal').textContent = settings.pitch;
  populateVoices();
};

function populateVoices(){
  const select = $('#setVoice');
  select.innerHTML = '';
  const voices = getVoices();
  voices.forEach(v => {
    const opt = new Option(`${v.name} (${v.lang})`, v.voiceURI);
    if(v.voiceURI === settings.voiceURI) opt.selected = true;
    select.append(opt);
  });
}

$('#setRate').oninput = (e) => { $('#rateVal').textContent = e.target.value; };
$('#setPitch').oninput = (e) => { $('#pitchVal').textContent = e.target.value; };

$('#testVoiceBtn').onclick = () => {
  settings.rate = $('#setRate').value;
  settings.pitch = $('#setPitch').value;
  settings.voiceURI = $('#setVoice').value;
  speak(lang === 'uk' ? 'Це перевірка голосу' : 'Это проверка голоса');
};

$('#closeSettBtn').onclick = () => {
  const oldLevel = settings.level;
  settings.theme = $('#setTheme').value;
  settings.level = $('#setSeg').value;
  settings.rate = $('#setRate').value;
  settings.pitch = $('#setPitch').value;
  settings.voiceURI = $('#setVoice').value;

  localStorage.setItem('aac.settings', JSON.stringify(settings));
  applyTheme();

  if(oldLevel !== settings.level){
    tree = ld('aac.tree_' + settings.level, null) || getTreeForLevel();
    path = [];
  }

  settModal.style.display = 'none';
  render();
};

/* ---------- Модальное окно РЕДАКТОРА ---------- */
const ed=$('#ed');
$('#gear').onclick = () => openEd();
const find=id=>{let r=null;const w=(l)=>l.forEach(n=>{if(n.id===id)r={n,l};if(n.c)w(n.c)});w(tree);return r};
function openEd(){ed.style.display='block';drawEd()}
function drawEd(){
  ed.innerHTML='';
  ed.append(h('h2',null,'✏️ Редактор'),h('p','note','Управление плитками словаря текущего уровня.'));
  const s=h('select');s.append(new Option('— Главный экран —',''));
  const w=(l,d)=>l.forEach(n=>{s.append(new Option('· '.repeat(d)+t(n.l)+' '+(n.e||''),n.id));if(n.c)w(n.c,d+1)});w(tree,0);
  s.value=sel;s.onchange=()=>{sel=s.value;drawEd()};ed.append(h('label',null,'Плитка'),s);
  const f=sel&&find(sel);
  const fld=(lb,val)=>{const i=h('input');i.type='text';i.value=val;ed.append(h('label',null,lb),i);return i};
  let ir,iu,sr,su,ie;
  if(f){
    const n=f.n,[lr,lu]=(n.l||'').split('|'),[a,b]=(n.s||'').split('|');
    ir=fld('Название (русский)',lr||'');iu=fld('Название (украинский)',lu||'');
    sr=fld('Фраза (русский)',a||'');su=fld('Фраза (украинский)',b||'');ie=fld('Значок (эмодзи)',n.e||'');
  }
  const r=h('div','row');
  if(f){
    r.append(h('button',null,'Сохранить',()=>{const n=f.n;n.l=ir.value+'|'+iu.value;n.s=sr.value+'|'+su.value;n.e=ie.value;save();drawEd()}));
    r.append(h('button','d','Удалить',()=>{if(confirm('Удалить плитку?')){f.l.splice(f.l.indexOf(f.n),1);sel='';save();drawEd()}}));
  }
  r.append(h('button',null,'+ Добавить плитку',()=>{
    const n={id:'n'+Date.now(),l:'Новая|Нова',s:'Я хочу|Я хочу',e:'💬'};
    if(f){(f.n.c=f.n.c||[]).push(n)}else{n.col='#1E3A8A';tree.push(n)}
    sel=n.id;save();drawEd()}));
  ed.append(r);
  ed.append(h('button',null,'Закрыть редактор',()=>{ed.style.display='none';path=[];closeOv();render()}));
}

/* ---------- Запуск приложения ---------- */
$('#lang').textContent=lang.toUpperCase();
document.documentElement.lang=lang;
labels();
render();

if('speechSynthesis' in window){
  speechSynthesis.onvoiceschanged = () => populateVoices();
}

if('serviceWorker' in navigator){
  addEventListener('load',()=>navigator.serviceWorker.register('/Govorim/sw.js',{scope:'/Govorim/'}).catch(()=>{}));
}
</script>
